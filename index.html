}
function PlaceEditor({ place, store, onClose, toast }){
  const t = place || {};
  const [name,setName]=useState(t.name||"");
  const [full,setFull]=useState(t.full||"");
  const [kind,setKind]=useState(t.kind||"metro");
  // Coordinates are optional. A place without them simply appears beside the map
  // rather than being given an invented position.
  const seedLL = PLACE_COORDS[t.id];
  const [lat,setLat]=useState(t.lat != null ? String(t.lat) : (seedLL ? String(seedLL[1]) : ""));
  const [lon,setLon]=useState(t.lon != null ? String(t.lon) : (seedLL ? String(seedLL[0]) : ""));
  function save(){
    if(!name.trim()){ toast("Name it first"); return; }
    const la = lat.trim()===""? null : Number(lat), lo = lon.trim()===""? null : Number(lon);
    if((la!=null && !isFinite(la)) || (lo!=null && !isFinite(lo))){ toast("Latitude and longitude must be numbers"); return; }
    store.upsert("places", { id:t.id, name:name.trim(), full:full.trim(), kind, order:t.order,
                             lat:la, lon:lo });
    toast(t.id?"Saved":"Added"); onClose();
  }
  function del(){ if(t.id){ store.remove("places", t.id); toast("Removed"); } onClose(); }
  return (
    <div className="wa-modalscrim" onClick={onClose}>
      <div className="wa-sheet" onClick={(e)=>e.stopPropagation()} role="dialog" aria-label="Edit place">
        <div className="wa-sheet__head"><h2>{t.id?"Edit place":"Add place"}</h2><button className="wa-x" onClick={onClose}>{"×"}</button></div>
        <div className="wa-field"><span className="wa-label">Name</span><input className="wa-input" value={name} onChange={e=>setName(e.target.value)} placeholder="e.g. Dallas" autoFocus /></div>
        <div className="wa-field"><span className="wa-label">Detail</span><input className="wa-input" value={full} onChange={e=>setFull(e.target.value)} placeholder="e.g. house & apartments" /></div>
        <div className="wa-field"><span className="wa-label">Kind</span>
          <select className="wa-select" value={kind} onChange={e=>setKind(e.target.value)}>{PLACE_KINDS.map(k=><option key={k} value={k}>{k}</option>)}</select></div>
        <div className="wa-row2">
          <div className="wa-field"><span className="wa-label">Latitude</span>
            <input className="wa-input" value={lat} onChange={e=>setLat(e.target.value)} placeholder="e.g. 32.78" inputMode="decimal" /></div>
          <div className="wa-field"><span className="wa-label">Longitude</span>
            <input className="wa-input" value={lon} onChange={e=>setLon(e.target.value)} placeholder="e.g. -96.80" inputMode="decimal" /></div>
        </div>
        <p className="wa-hint" style={{marginTop:-6,marginBottom:14}}>Optional, and only used by the map. Leave blank and the place is listed beside the map instead. Longitude is negative in the US.</p>
        <button className="wa-btn wa-btn--primary wa-btn--block" onClick={save}>{t.id?"Save changes":"Add"}</button>
        {t.id && <button className="wa-btn wa-btn--danger wa-btn--block" style={{marginTop:10}} onClick={del}>Remove</button>}
      </div>
    </div>
  );
}

/* ============================================================ SWIPE ROW ============================================================ */
/* Swipe a row left to reveal a Delete action (portfolio standard, ported from
   Tracker). Horizontal-only, so vertical scroll is unaffected; a swipe
   suppresses the row's open-on-tap. */
const TRASH_ICON = (
  <svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m3 0-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" strokeLinecap="round" strokeLinejoin="round"/></svg>
);
function SwipeRow({ onDelete, className, children }){
  const [dx,setDx] = useState(0);
  const st = useRef(null); const moved = useRef(false);
  // Pointer capture is deferred until horizontal drag intent: capturing on
  // pointerdown retargets the follow-up click to the swipe body, which eats
  // desktop mouse clicks on the wrapped row's buttons (rows look dead).
  function down(e){ st.current = { x:e.clientX, y:e.clientY, base:dx }; moved.current = false; }
  function move(e){
    if(!st.current) return;
    const ddx = e.clientX - st.current.x, ddy = e.clientY - st.current.y;
    if(!moved.current && Math.abs(ddx) > 8 && Math.abs(ddx) > Math.abs(ddy)){
      moved.current = true;
      try{ e.currentTarget.setPointerCapture(e.pointerId); }catch(_){}
    }
    if(moved.current){ setDx(Math.max(-96, Math.min(0, st.current.base + ddx))); }
  }
  function end(){ if(!st.current) return; st.current = null; setDx(d => { const nd = d <= -48 ? -84 : 0; if(nd===0) moved.current = false; return nd; }); }
  function clickCapture(e){ if(moved.current || dx !== 0){ e.stopPropagation(); e.preventDefault(); moved.current = false; setDx(0); } }
  return (
    <div className={"swipe-wrap"+(className?" "+className:"")}>
      <button className="swipe-del" onClick={(e)=>{ e.stopPropagation(); setDx(0); onDelete(); }}>{TRASH_ICON}<span>Delete</span></button>
      <div className="swipe-body" style={{ transform:`translateX(${dx}px)`, transition: st.current ? "none" : "transform .18s" }}
        onPointerDown={down} onPointerMove={move} onPointerUp={end} onPointerCancel={end} onClickCapture={clickCapture}>
        {children}
      </div>
    </div>
  );
}

function Settings({ store, entities, places, placeOf, onColor, onResetColors, onEditPerson, onAddPerson, onEditPlace, onAddPlace, onEditPlacement, onDeleteRow, onClose, onCheckUpdate, onApplyUpdate, update, updMsg }){
  const [diag, setDiag] = useState(false);
  const [confirmReload, setConfirmReload] = useState(false);
  const people = entities.filter((e) => e.kind === "person");
  const pets = entities.filter((e) => e.kind === "pet");
  const placements = store.data.placements || [];

  // Deleting a person or pet is heavy (their pins/trips/journeys stop rendering),
  // so the swipe still asks before it deletes - and the undo toast backs that up.
  const PersonRow = (e) => (
    <SwipeRow key={e.id} onDelete={()=>{
      if(window.confirm("Delete "+e.name+" from the family? Their pins, trips and journeys will stop showing on the calendar.")) onDeleteRow("entities", e, e.name);

      <div className="wa-set__row">

    if(p.type==="journey") return { txt: firstName((entities.find(e=>e.id===p.entityId)||{}).name||p.entityId), sub:`${placeOf(p.from).name} → ${placeOf(p.to).name} · ${fmtYmd(p.date)}` };
    if(p.type==="trip"){ const names=(p.entityIds||[]).map(id=>firstName((entities.find(e=>e.id===id)||{}).name||id)).join(", "); return { txt:names||"Trip", sub:`${placeOf(p.place).name} · ${fmtYmd(p.start)}–${fmtYmd(p.end)}${p.tag?" · "+p.tag:""}` }; }
    return { txt: firstName((entities.find(e=>e.id===p.entityId)||{}).name||p.entityId), sub:`${placeOf(p.place).name} · ${fmtYmd(p.date)}` };
  };

  return (
    <>
      <div className="wa-scrim" onClick={onClose} />
      <div className="wa-drawer" role="dialog" aria-label="Settings">
        {diag ? <Diagnostics onClose={()=>setDiag(false)} /> : (
          <>
            <div className="wa-drawer__head"><h2>Settings</h2><button className="wa-x" onClick={onClose} aria-label="Close">{"×"}</button></div>

            <p className="wa-set__group">People</p>
            {people.map(PersonRow)}
            <p className="wa-set__group">Pets</p>
            {pets.map(PersonRow)}
            <button className="wa-addrow" onClick={onAddPerson}>+ Add person or pet</button>
            <button className="wa-set__reset" onClick={onResetColors}>Reset colors to defaults</button>

              <SwipeRow key={p.id} onDelete={()=>onDeleteRow("places", p, p.name)}>
                <div className="wa-set__row">
                  <button className="wa-set__name" onClick={()=>onEditPlace(p)}>{p.name}<small>{p.kind}{p.full?" · "+p.full:""}</small></button>
                </div>
              </SwipeRow>
            ))}
            <button className="wa-addrow" onClick={onAddPlace}>+ Add place</button>

            <p className="wa-set__group">Placements ({placements.length})</p>
            {placements.length===0 && <p className="wa-hint">None yet. Tap a person in Now or Day, or the + button, to set where someone is.</p>}
            {placements.map(p => {
              const L = placementLabel(p);
              return (
                <SwipeRow key={p.id} className="swipe-wrap--card" onDelete={()=>onDeleteRow("placements", p, (L.txt?L.txt+" ":"")+p.type)}>
                  <div className="wa-prow">
                    <div className="wa-prow__txt"><b>{L.txt}</b> <span style={{color:"var(--muted)",textTransform:"capitalize"}}>{p.type}</span><div className="wa-prow__sub">{L.sub}</div></div>
                    <button className="wa-prow__del" onClick={()=>onEditPlacement(p)} title="Edit">{"✎"}</button>

            })}

            {CONFIGURED && <>
              <p className="wa-set__group">Family account</p>
              <div className="wa-set__row"><b>Signed in</b><span style={{marginLeft:"auto",color:"var(--muted)",fontSize:13}}>{store.authEmail||"-"}</span></div>
              <button className="wa-actrow" onClick={()=>store.pull()}><b>Force sync now</b><span>Pull from the backend</span></button>
              {/* Replaces the old "sign out to force a refresh" workaround: makes the
                  cloud authoritative after data is loaded straight into the database. */}
              {!confirmReload
                ? <button className="wa-actrow" onClick={()=>setConfirmReload(true)}>
                    <b>Reload from cloud</b><span>Replace this device's copy</span></button>
                : <div className="wa-set__row" style={{flexWrap:"wrap"}}>

          </>
        )}
      </div>
    </>
  );
}

/* ============================================================ LOGIN ============================================================ */
function Login({ store, toast }){
  const [mode,setMode]=useState("signin");
  const [email,setEmail]=useState(""); const [password,setPassword]=useState("");
  const [busy,setBusy]=useState(false); const [err,setErr]=useState(""); const [sent,setSent]=useState(false);
  const isSignup = mode==="signup";
  async function submit(){
    setErr("");
    if(!email.trim()||!password){ setErr("Email and password are required."); return; }
    if(isSignup && password.length<6){ setErr("Password must be at least 6 characters."); return; }
    setBusy(true);
    try{
      if(isSignup){ const { needsConfirm } = await store.signUp(email, password); if(needsConfirm) setSent(true); else toast("Account created"); }
      else { await store.signIn(email, password); toast("Signed in"); }
    }catch(e){ setErr(e.message||"Something went wrong."); } finally{ setBusy(false); }
  }
  if(sent){
    return (
      <div className="wa-login">
        <div className="wa-login__eyebrow">Almost there</div><h1 className="wa-login__title">Check your email</h1>
        <p className="wa-hint" style={{marginTop:10,fontSize:14}}>We sent a confirmation link to <b>{email.trim()}</b>. Tap it, then come back and sign in.</p>
        <button className="wa-btn wa-btn--block" style={{marginTop:18}} onClick={()=>{ setSent(false); setMode("signin"); setPassword(""); setErr(""); }}>Back to sign in</button>
      </div>
    );
  }
  return (
    <div className="wa-login">
      <div className="wa-login__eyebrow">{isSignup?"Get started":"Welcome back"}</div>
      <h1 className="wa-login__title">Whereabouts</h1>
      <p className="wa-hint" style={{marginTop:8,fontSize:14}}>The family calendar of where everyone's planned to be. {isSignup?"Create your family account to sync across the wall tablet and phones.":"Sign in to your family account."}</p>
      <div className="wa-card" style={{marginTop:18}}>
        <div className="wa-field"><span className="wa-label">Email</span>
          <input className="wa-input" type="email" value={email} autoCapitalize="off" autoCorrect="off" onChange={e=>setEmail(e.target.value)} placeholder="you@example.com" onKeyDown={e=>{ if(e.key==="Enter") submit(); }}/></div>
        <div className="wa-field"><span className="wa-label">Password</span>
          <input className="wa-input" type="password" value={password} autoCapitalize="off" onChange={e=>setPassword(e.target.value)} placeholder={isSignup?"At least 6 characters":"Your password"} onKeyDown={e=>{ if(e.key==="Enter") submit(); }}/></div>
        {err && <p className="wa-hint" style={{color:"var(--red)"}}>{err}</p>}
        <button className="wa-btn wa-btn--primary wa-btn--block" style={{marginTop:6}} disabled={busy} onClick={submit}>{busy?"...":(isSignup?"Create account":"Sign in")}</button>
      </div>
      <button className="wa-btn wa-btn--block" style={{marginTop:12}} disabled={busy} onClick={()=>{ setErr(""); setMode(isSignup?"signin":"signup"); }}>
        {isSignup ? "Already have an account? Sign in" : "New here? Create an account"}</button>
      <p className="wa-hint" style={{textAlign:"center",marginTop:16,opacity:.6}}>v{APP_VERSION}</p>
    </div>
  );
}

function projectAlbers(lon, lat){
  const R = Math.PI/180;
  const p1 = 29.5*R, p2 = 45.5*R, p0 = 37.5*R, l0 = -96*R;
  const n = (Math.sin(p1) + Math.sin(p2)) / 2;
  const C = Math.cos(p1)*Math.cos(p1) + 2*n*Math.sin(p1);
  const rho0 = Math.sqrt(C - 2*n*Math.sin(p0)) / n;
  const phi = lat*R, lam = lon*R;
  const rho = Math.sqrt(Math.max(0, C - 2*n*Math.sin(phi))) / n;
  const theta = n * (lam - l0);
  const x = rho*Math.sin(theta), y = rho0 - rho*Math.cos(theta);
  return { x:(x - US_PROJ.minx)*US_PROJ.scale, y:(US_PROJ.maxy - y)*US_PROJ.scale };
}

// Coordinates for the places the app ships with. Any place can carry its own
// lat/lon (editable in the place editor); this is only the seed.
const PLACE_COORDS = {
  sanantonio:[-98.49,29.42], dallas:[-96.80,32.78], austin:[-97.74,30.27],
  boston:[-71.06,42.36], auburn:[-85.48,32.61], chicago:[-87.63,41.88],
  newyork:[-74.01,40.71], bethesda:[-77.10,38.98], miami:[-80.19,25.76],
  office:[-96.80,32.78],                       // the office is in Dallas
};

function MapToday({ entities, cursor, ctx, onPick }){
  const [full,setFull] = useState(false);
  // Escape closes it, and while it is open nothing behind should scroll.
  useEffect(() => {
    if(!full) return;
    const onKey = (e) => { if(e.key === "Escape") setFull(false); };
    const prev = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    window.addEventListener("keydown", onKey);
    return () => { document.body.style.overflow = prev; window.removeEventListener("keydown", onKey); };
  }, [full]);

  const L = useMemo(() => {
    // Group everyone by where they are right now.
    const byPlace = new Map();
    entities.forEach(e => {
      const jr = ctx.journeyOf(e.id, cursor);
      const pid = jr ? (cursor.getHours() < 14 ? jr.from : jr.to) : ctx.placementAt(e.id, cursor);
      if(!byPlace.has(pid)) byPlace.set(pid, []);
      byPlace.get(pid).push({ e, state: ctx.stateAt(e.id, cursor), journey: jr });
    });

    const placed = [], offMap = [];
    byPlace.forEach((members, pid) => {
      const p = ctx.placeOf(pid);
      const ll = (p.lat != null && p.lon != null) ? [p.lon, p.lat] : PLACE_COORDS[pid];
      if(!ll){ offMap.push({ pid, place:p, members }); return; }
      const pt = projectAlbers(ll[0], ll[1]);
      // Outside the lower-48 frame (Europe, Hawaii...) - list it instead of
      // clamping it to an edge, which would be a lie about where they are.
      if(pt.x < 0 || pt.x > US_VIEW.w || pt.y < 0 || pt.y > US_VIEW.h){
        offMap.push({ pid, place:p, members }); return;
      }
      placed.push({ pid, place:p, members, cx:pt.x, cy:pt.y, x:pt.x, y:pt.y });
    });

    // Nudge overlapping clusters apart, keeping a leader line back to the true
    // city point. Texas alone puts San Antonio, Austin and Dallas within ~80 units.
    const radius = (g) => 16 + Math.ceil(g.members.length/3)*11;
    for(let iter=0; iter<80; iter++){
      for(let i=0;i<placed.length;i++){
        for(let j=i+1;j<placed.length;j++){
          const a=placed[i], b=placed[j];
          let dx=b.x-a.x, dy=b.y-a.y;
          let d=Math.hypot(dx,dy) || 0.01;
          const min = radius(a)+radius(b)+6;
          if(d < min){
            const push=(min-d)/2/d;
            dx*=push; dy*=push;
            a.x-=dx; a.y-=dy; b.x+=dx; b.y+=dy;
          }
        }
      }
    }
    placed.forEach(g => {                       // keep clusters inside the frame
      g.x = Math.max(radius(g)+2, Math.min(US_VIEW.w-radius(g)-2, g.x));
      g.y = Math.max(radius(g)+14, Math.min(US_VIEW.h-radius(g)-2, g.y));
    });
    return { placed, offMap };
  }, [entities, cursor, ctx]);

  const tokenAt = (m, x, y, key) => {
    const e = m.e, isPet = e.kind === "pet";
    const fill = m.state === "unusual" ? e.color
               : m.state === "expected" ? rgba(e.color, 0.55) : rgba(e.color, 0.18);
    const txt  = m.state === "home" ? "#19212B" : readableText(e.color);
    const ring = (e.color||"").toUpperCase()==="#FFFFFF" ? "#C7CDD6"
               : (m.state === "unusual" ? "none" : rgba(e.color, 0.75));
    return (
      // stopPropagation so tapping a person opens their placement rather than
      // expanding the map.
      <g key={key} onClick={(ev)=>{ ev.stopPropagation(); onPick && onPick(e.id, cursor); }} style={{cursor:"pointer"}}>
        {isPet
          ? <rect x={x-10} y={y-10} width="20" height="20" rx="6" fill={fill} stroke={ring} strokeWidth="1.5" />
          : <circle cx={x} cy={y} r="10" fill={fill} stroke={ring} strokeWidth="1.5" />}
        <text x={x} y={y} dy="0.34em" textAnchor="middle" className="wa-map__mono" fill={txt}>{e.short}</text>
        <title>{e.name + " - " + ctx.placeOf(ctx.placementAt(e.id, cursor)).name}</title>
      </g>
    );
  };

  const svg = (
    <svg viewBox={`0 0 ${US_VIEW.w} ${US_VIEW.h}`} className="wa-map__svg"
         preserveAspectRatio="xMidYMid meet" role="img"
         aria-label="Where the family is today, on a map of the United States">
      <path d={US_PATH} className="wa-map__land" vectorEffect="non-scaling-stroke" />
      {L.placed.map(g => (
        <g key={g.pid}>
          {(Math.hypot(g.x-g.cx, g.y-g.cy) > 4) &&
            <line x1={g.cx} y1={g.cy} x2={g.x} y2={g.y} className="wa-map__leader" />}
          <circle cx={g.cx} cy={g.cy} r="2.5" className="wa-map__pin" />
          <text x={g.x} y={g.y - (Math.ceil(g.members.length/3)*11) - 6}
                textAnchor="middle" className="wa-map__city">{g.place.name}</text>
          {g.members.map((m, i) => {
            const n = g.members.length, cols = Math.min(3, n);
            const rows = Math.ceil(n/cols);
            const col = i % cols, row = Math.floor(i/cols);
            const inRow = Math.min(cols, n - row*cols);
            const x = g.x + (col - (inRow-1)/2) * 22;
            const y = g.y + (row - (rows-1)/2) * 22;
            return tokenAt(m, x, y, m.e.id);
          })}
        </g>
      ))}
    </svg>
  );

  // FULL-SCREEN: just the map. Rotating to landscape gives it far more room, and
  // preserveAspectRatio keeps it centred and undistorted in either orientation.
  // Uses a fixed overlay rather than the Fullscreen API, which iOS Safari does not
  // support for arbitrary elements - the overlay behaves the same everywhere.
  if(full){
    return (
      <div className="wa-mapfull" onClick={()=>setFull(false)}>
        {svg}
        {/* Anyone abroad would simply VANISH here, which would misread as "not
            travelling". One quiet line keeps that honest without adding chrome. */}
        {L.offMap.length > 0 && (
          <p className="wa-mapfull__off">
            {L.offMap.map(g => g.members.map(m => firstName(m.e.name)).join(" + ") + " in " + g.place.name).join("  ·  ")}
          </p>
        )}
        <button className="wa-mapfull__x" aria-label="Close full screen"
                onClick={(e)=>{ e.stopPropagation(); setFull(false); }}>{"×"}</button>
      </div>
    );
  }

  return (
    <div className="wa-map">
      <div className="wa-map__tap" onClick={()=>setFull(true)} title="Tap to expand">
        {svg}
      </div>
      {L.offMap.length > 0 && (
        <div className="wa-map__off">
          <p className="wa-map__offh">Not on this map</p>
          {L.offMap.map(g => (
            <div key={g.pid} className="wa-map__offrow">
              <span className="wa-map__offwho">
                {g.members.map(m => <Token key={m.e.id} entity={m.e} size={20} state={m.state} />)}
              </span>
              <span className="wa-map__offplace">{g.place.name}</span>
            </div>
          ))}
        </div>
      )}
      <p className="wa-hint" style={{textAlign:"center",margin:"8px 0 2px"}}>Tap the map for full screen. Rotate for a bigger view.</p>
    </div>
  );
}

/* ============================================================
   STORYLINE VIEW - the signature visualization.
   ------------------------------------------------------------
   Each person is a LINE flowing left to right through time.
   - y = PLACE (bands), first place in placeOrder at the BOTTOM, so altitude reads
     as "further from home". Binding y to place is the key simplification: classic
     storyline layout has to choose the vertical order of groups, which is NP-hard.
     Ours is fixed, so lines cross exactly when people actually swap places.
   - A day someone stays put is a FLAT run. A travel day is a DIAGONAL inside that
     day's column - the Marey/Ibry graphical-timetable convention, where horizontal
     means stopped and diagonal means moving.
   - Color only appears when someone is AWAY from their own home base; at home the
     line is quiet slate. So a calm week renders nearly monochrome, and the amount
     of colored ink IS how scattered the family is.
   - People in the same place occupy adjacent slots, so travelling together reads
     as one thick band.
   ============================================================ */
// GUTTER is small because the place labels live in a separate sticky DOM column
// beside the scrollable SVG, not inside it.
const ST = { LANE:20, BAND_GAP:18, PAD_TOP:34, PAD_BOT:14, COL_W:78, GUTTER:10 };

function storySegment(pts, xs, hold, k, a, b){
  // One continuous path across days a..b: flat (or diagonal) inside each day
  // column, eased S-curve between columns.
  let d = `M ${xs[a]-hold} ${pts[a].y1} L ${xs[a]+hold} ${pts[a].y2}`;
  for(let t=a; t<b; t++){
    const x1 = xs[t]+hold, x2 = xs[t+1]-hold;
    const yA = pts[t].y2, yB = pts[t+1].y1;
    d += (yA === yB) ? ` L ${x2} ${yB}` : ` C ${x1+k} ${yA} ${x2-k} ${yB} ${x2} ${yB}`;
    d += ` L ${xs[t+1]+hold} ${pts[t+1].y2}`;
  }
  return d;
}

function StoryView({ entities, days, ctx, onPickDay, onPick }){
  const layout = useMemo(() => {
    const today = new Date();
    // --- resolve the window once ---
    const grid = {}, jour = {};
    entities.forEach(e => {
      grid[e.id] = days.map(d => ctx.dayPlacement(e.id, d));
      jour[e.id] = days.map(d => ctx.journeyOf(e.id, d));
    });
    // --- movers only: hide anyone who sat at home all window and never moved ---
    const stateAtDay = (id, t) => jour[id][t] ? "unusual" : ctx.dayState(id, days[t]);
    const isAwayAt = (id, t) => stateAtDay(id, t) !== "home";
    const interesting = entities.filter(e => {
      const moved = new Set(grid[e.id]).size > 1 || jour[e.id].some(Boolean);
      const away  = days.some((_, t) => isAwayAt(e.id, t));
      return moved || away;
    });
    const hidden = entities.length - interesting.length;
    if(!interesting.length) return { empty:true, hidden, H:80 };

    // --- which place bands are occupied ---
    const occ = new Set();
    interesting.forEach(e => days.forEach((_, t) => {
      const j = jour[e.id][t];
      if(j){ occ.add(j.from); occ.add(j.to); } else occ.add(grid[e.id][t]);
    }));
    let bands = ctx.placeOrder.filter(p => occ.has(p));
    occ.forEach(p => { if(!bands.includes(p)) bands.push(p); });

    // --- lane count per band = peak concurrent occupancy ---
    const lanes = {};
    bands.forEach(p => {
      let mx = 1;
      days.forEach((_, t) => {
        let c = 0;
        interesting.forEach(e => {
          const j = jour[e.id][t];
          if(j){ if(j.from === p || j.to === p) c++; }
          else if(grid[e.id][t] === p) c++;
        });
        if(c > mx) mx = c;
      });
      lanes[p] = mx;
    });

    // --- band tops; render top-down but with placeOrder[0] at the BOTTOM ---
    const topDown = bands.slice().reverse();
    const bandTop = {};
    let y = ST.PAD_TOP;
    topDown.forEach(p => { bandTop[p] = y; y += lanes[p]*ST.LANE + ST.BAND_GAP; });
    const H = y - ST.BAND_GAP + ST.PAD_BOT;

    // --- slot assignment: one forward barycenter sweep ---
    // Sorting each band's members by where they were the previous day keeps lines
    // from needlessly crossing: someone arriving from a band above enters at the
    // top slot, someone from below enters at the bottom.
    const rosterIdx = {}; entities.forEach((e,i) => { rosterIdx[e.id] = i; });
    const pos = {}; interesting.forEach(e => { pos[e.id] = []; });
    let prev = null;
    days.forEach((_, t) => {
      const cur = {};
      bands.forEach(p => {
        const members = interesting.filter(e => {
          const j = jour[e.id][t];
          if(j) return j.from === p || j.to === p;
          return grid[e.id][t] === p;
        });
        members.sort((a,b) => {
          if(!prev) return rosterIdx[a.id] - rosterIdx[b.id];
          const pa = prev[a.id] !== undefined ? prev[a.id] : bandTop[p];
          const pb = prev[b.id] !== undefined ? prev[b.id] : bandTop[p];
          return pa - pb || rosterIdx[a.id] - rosterIdx[b.id];
        });
        members.forEach((e, k) => {
          const yy = bandTop[p] + k*ST.LANE + ST.LANE/2;
          const j = jour[e.id][t];
          if(!pos[e.id][t]) pos[e.id][t] = {};
          if(j){
            if(j.from === p) pos[e.id][t].y1 = yy;
            if(j.to === p)   pos[e.id][t].y2 = yy;
          } else { pos[e.id][t].y1 = yy; pos[e.id][t].y2 = yy; }
          cur[e.id] = yy;
        });
      });
      prev = cur;
    });
    // Safety: fill any gap so a path never hits undefined.
    interesting.forEach(e => days.forEach((_, t) => {
      const p = pos[e.id][t] || (pos[e.id][t] = {});
      if(p.y1 === undefined) p.y1 = p.y2 !== undefined ? p.y2 : ST.PAD_TOP;
      if(p.y2 === undefined) p.y2 = p.y1;
    }));

    // --- runs of contiguous SAME-STATE away days, so each can be drawn at its
    //     own strength (expected = muted, unusual = full color) ---
    const runs = {};
    interesting.forEach(e => {
      const r = []; let start = null, kind = null;
      days.forEach((_, t) => {
        const st = stateAtDay(e.id, t);
        const away = st !== "home";
        if(away && start === null){ start = t; kind = st; }
        else if(away && st !== kind){ r.push([start, t-1, kind]); start = t; kind = st; }
        if(!away && start !== null){ r.push([start, t-1, kind]); start = null; kind = null; }
        if(away && t === days.length-1){ r.push([start, t, kind]); start = null; kind = null; }
      });
      runs[e.id] = r;
    });

    const xs = days.map((_, t) => ST.GUTTER + t*ST.COL_W + ST.COL_W/2);
    const W = ST.GUTTER + days.length*ST.COL_W + 16;
    const todayIdx = days.findIndex(d => sameDay(d, today));
    return { empty:false, hidden, interesting, grid, jour, bands, topDown, lanes,
             bandTop, pos, runs, xs, W, H, todayIdx, isAwayAt };
  }, [entities, days, ctx]);

  if(layout.empty){
    return (
      <div className="wa-card">
        <p className="wa-hint" style={{textAlign:"center",padding:"28px 0"}}>
          Everyone was in their home base all week - nothing moved.
        </p>
      </div>
    );
  }

  const { interesting, bands, topDown, lanes, bandTop, pos, runs, xs, W, H, todayIdx, jour, grid } = layout;
  const hold = ST.COL_W*0.34, k = ST.COL_W*0.22;

  return (
    <div className="wa-story">
      <div className="wa-story__labels" style={{height:H}}>
        {topDown.map(p => (
          <span key={p} className="wa-story__lbl"
            style={{ top: bandTop[p] + (lanes[p]*ST.LANE)/2 - 8 }}>
            {ctx.placeOf(p).name}
          </span>
        ))}
      </div>
      <div className="wa-story__scroll">
        <svg width={W} height={H} role="img"
             aria-label={"Where each person is across " + days.length + " days"}>
          {/* day columns + headers */}
          {days.map((d, t) => (
            <g key={t} onClick={()=>onPickDay && onPickDay(d)} style={{cursor:"pointer"}}>
              <rect x={xs[t]-ST.COL_W/2} y={0} width={ST.COL_W} height={H}
                    fill={t===todayIdx ? "rgba(25,33,43,.045)" : "transparent"} />
              <text x={xs[t]} y={15} textAnchor="middle" className="wa-story__dn">{DAY_NAMES[d.getDay()]}</text>
              <text x={xs[t]} y={28} textAnchor="middle"
                    className={"wa-story__dd" + (t===todayIdx ? " is-today" : "")}>{d.getDate()}</text>
            </g>
          ))}
          {/* band baselines */}
          {topDown.map(p => (
            <line key={p} x1={ST.GUTTER-8} x2={W-8}
                  y1={bandTop[p] + lanes[p]*ST.LANE + ST.BAND_GAP/2 - 2}
                  y2={bandTop[p] + lanes[p]*ST.LANE + ST.BAND_GAP/2 - 2}
                  className="wa-story__rule" />
          ))}
          {/* the lines: a quiet base for the whole week, colored only where away */}
          {interesting.map(e => {
            const pts = pos[e.id];
            const full = storySegment(pts, xs, hold, k, 0, days.length-1);
            return (
              <g key={e.id}>
                <path d={full} className="wa-story__halo" />
                <path d={full} className="wa-story__base" />
                {runs[e.id].map(([a,b,kind], i) => (
                  <path key={i} d={storySegment(pts, xs, hold, k, a, b)}
                        fill="none" stroke={kind==="unusual" ? e.color : rgba(e.color, 0.42)}
                        strokeWidth={kind==="unusual" ? 3 : 2.5}
                        strokeLinecap="round" strokeLinejoin="round" />
                ))}
                {/* identity marker at the start of each away stretch */}
                {runs[e.id].map(([a,,kind], i) => {
                  const cy = pts[a].y1, cx = xs[a]-hold;
                  const isPet = e.kind === "pet";
                  const fill = kind==="unusual" ? e.color : rgba(e.color, 0.42);
                  const txt = kind==="unusual" ? readableText(e.color) : "#19212B";
                  const ring = (e.color||"").toUpperCase()==="#FFFFFF" ? "#C7CDD6"
                             : (kind==="unusual" ? "none" : rgba(e.color, 0.8));
                  return (
                    <g key={"m"+i} onClick={()=>onPick && onPick(e.id, days[a])} style={{cursor:"pointer"}}>
                      {isPet
                        ? <rect x={cx-8} y={cy-8} width="16" height="16" rx="5" fill={fill} stroke={ring} />
                        : <circle cx={cx} cy={cy} r="8" fill={fill} stroke={ring} />}
                      <text x={cx} y={cy} dy="0.32em" textAnchor="middle"
                            className="wa-story__mono" fill={txt}>{e.short}</text>
                    </g>
                  );
                })}
                {/* fat invisible hit target - a 3px line is untappable */}
                <path d={full} fill="none" stroke="transparent" strokeWidth="22"
                      pointerEvents="stroke" style={{cursor:"pointer"}}
                      onClick={()=>onPick && onPick(e.id, days[0])}>
                  <title>{e.name}</title>
                </path>
              </g>
            );
          })}
        </svg>
      </div>
      {layout.hidden > 0 && (
        <p className="wa-story__more">{layout.hidden} {layout.hidden===1?"other was":"others were"} in their home base all week.</p>
      )}
    </div>
  );
}

/* ============================================================
   MONTH STRIPS - one ribbon per person, a month across.
   Ink ONLY on away days (the leave-wallchart discipline), so a calm month is
   mostly empty and a busy one is mostly full. Rows are ordered by TRAJECTORY
   SIMILARITY rather than alphabetically, so people who travel together end up
   adjacent and a shared trip reads as one solid block instead of two unrelated
   stripes in a plaid grid.
   ============================================================ */
function MonthStrips({ entities, cursor, ctx, onPickDay }){
  const L = useMemo(() => {
    const y = cursor.getFullYear(), m = cursor.getMonth();
    const nDays = new Date(y, m+1, 0).getDate();
    const days = Array.from({length:nDays}, (_,i) => new Date(y, m, i+1));
    const grid = {}, jour = {};
    entities.forEach(e => {
      grid[e.id] = days.map(d => ctx.dayPlacement(e.id, d));
      jour[e.id] = days.map(d => ctx.journeyOf(e.id, d));
    });
    const stateAtDay = (id, t) => jour[id][t] ? "unusual" : ctx.dayState(id, days[t]);
    const awayAt = (id, t) => stateAtDay(id, t) !== "home";
    const movers = entities.filter(e =>
      days.some((_, t) => awayAt(e.id, t)) || new Set(grid[e.id]).size > 1);
    const hidden = entities.length - movers.length;

    // Greedy nearest-neighbour chain on Hamming distance between day-vectors.
    // Seeded with whoever was away most, so the busiest row is on top.
    const dist = (a,b) => { let d=0; for(let t=0;t<nDays;t++) if(grid[a][t]!==grid[b][t]) d++; return d; };
    const awayDays = (id) => days.reduce((n,_,t) => n + (awayAt(id,t)?1:0), 0);
    const pool = movers.slice().sort((a,b) => awayDays(b.id) - awayDays(a.id));
    const ordered = [];
    if(pool.length){
      ordered.push(pool.shift());
      while(pool.length){
        const last = ordered[ordered.length-1].id;
        let bi = 0, bd = Infinity;
        pool.forEach((e,i) => { const d = dist(last, e.id); if(d < bd){ bd = d; bi = i; } });
        ordered.push(pool.splice(bi,1)[0]);
      }
    }
    return { days, nDays, grid, jour, ordered, hidden, awayAt, stateAtDay };
  }, [entities, cursor, ctx]);

  const { days, nDays, grid, jour, ordered, hidden, awayAt, stateAtDay } = L;
  const cols = { gridTemplateColumns:`repeat(${nDays},1fr)` };

  if(!ordered.length){
    return <div className="wa-card"><p className="wa-hint" style={{textAlign:"center",padding:"28px 0"}}>
      Everyone was in their home base all month.</p></div>;
  }
  return (
    <div className="wa-strips">
      <div className="wa-strip wa-strip--head">
        <div className="wa-strip__who" />
        <div className="wa-strip__cells" style={cols}>
          {days.map((d,t) => (
            <span key={t} className={"wa-strip__num"+(d.getDay()===0?" is-wk":"")}>
              {(d.getDate()===1 || d.getDate()%7===0) ? d.getDate() : ""}
            </span>
          ))}
        </div>
      </div>
      {ordered.map(e => (
        <div className="wa-strip" key={e.id}>
          <div className="wa-strip__who"><Token entity={e} size={20} /><span>{firstName(e.name)}</span></div>
          <div className="wa-strip__cells" style={cols}>
            {days.map((d,t) => {
              const st = stateAtDay(e.id, t);
              const j = jour[e.id][t];
              const place = ctx.placeOf(grid[e.id][t]).name;
              const ink = st==="unusual" ? e.color : rgba(e.color, 0.34);
              const bg = st==="home" ? undefined
                : j ? { background:`linear-gradient(135deg, ${ink} 50%, ${rgba(e.color,.20)} 50%)` }
                    : { background: ink };
              return (
                <button key={t} style={bg}
                  className={"wa-strip__c"+(st!=="home"?" is-away":"")+(d.getDay()===0?" is-wk":"")}
                  title={firstName(e.name)+" - "+place+(st==="expected"?" (as usual)":"")+" - "+MONTH_ABBR[d.getMonth()]+" "+d.getDate()}
                  onClick={()=>onPickDay && onPickDay(d)} />
              );
            })}
          </div>
        </div>
      ))}
      {hidden > 0 && <p className="wa-story__more">{hidden} {hidden===1?"other was":"others were"} in their home base all month.</p>}
      <p className="wa-hint" style={{margin:"8px 4px 0"}}>Solid days are somewhere unusual; faded days are away as usual (school, the office). Split cells are travel days.</p>
    </div>
  );
}

/* ============================================================
   YEAR - the family's year as texture, plus its recurring STATES.
   Each day is a thin stack of stripes, one per person who is away, in fixed
   roster order - so identity survives as stripe POSITION even at a few pixels,
   where hue alone would fail. Days when everyone is in their home base draw
   almost nothing, so a calm stretch is visibly quiet.
   Underneath, the year's most common configurations are named in plain words.
   ============================================================ */
function YearStates({ entities, cursor, ctx, onPickMonth }){
  const L = useMemo(() => {
    const y = cursor.getFullYear();
    const dayInfo = new Map();          // ymd -> away entity list (roster order)
    const sig = new Map();              // signature -> { ids, count }
    for(let m=0; m<12; m++){
      const n = new Date(y, m+1, 0).getDate();
      for(let d=1; d<=n; d++){
        const date = new Date(y, m, d);
        // Only UNUSUAL days paint. Someone at school or at the office on an
        // ordinary day is not an event, so a routine stretch reads as calm.
        const away = entities.filter(e => ctx.dayState(e.id, date) === "unusual");
        dayInfo.set(m*100+d, away);
        const key = away.map(e => e.id).join("|");
        const s = sig.get(key) || { ids: away.map(e => e.id), count: 0 };
        s.count++; sig.set(key, s);
      }
    }
    const states = [...sig.values()].sort((a,b) => b.count - a.count).slice(0, 6);
    return { dayInfo, states };
  }, [entities, cursor, ctx]);

  const nameOf = (id) => { const e = entities.find(x => x.id === id); return e ? firstName(e.name) : id; };
  // Name the state by WHO, not just how many - two different groups of five are
  // different facts, and "5 away" twice in a list tells you nothing.
  const label = (ids) => {
    if(!ids.length) return "Everyone where they should be";
    if(ids.length <= 3) return ids.map(nameOf).join(" + ") + " away";
    return ids.slice(0,2).map(nameOf).join(" + ") + " +" + (ids.length-2) + " more away";
  };
  const stripes = (away) => {
    if(!away.length) return undefined;
    const show = away.slice(0, 4);
    const step = 100/show.length;
    const stops = show.map((e,i) => `${e.color} ${i*step}% ${(i+1)*step}%`).join(", ");
    return { background:`linear-gradient(90deg, ${stops})` };
  };
  const y = cursor.getFullYear();

  return (
    <div className="wa-year">
      {Array.from({length:12}).map((_, m) => {
        const gridStart = startOfWeek(new Date(y, m, 1));
        const cells = Array.from({length:42}).map((_, i) => addDays(gridStart, i));
        return (
          <div key={m} className="wa-ymonth">
            <button className="wa-ymonth__label" onClick={()=>onPickMonth(m)}>{MONTH_ABBR[m]}</button>
            <div className="wa-ymonth__grid">
              {cells.map((d, i) => {
                const inMonth = d.getMonth() === m;
                const away = inMonth ? (L.dayInfo.get(m*100 + d.getDate()) || []) : [];
                return <span key={i} className={"wa-ycell"+(inMonth?"":" is-out")+(inMonth&&!away.length?" is-calm":"")}
                  style={inMonth ? stripes(away) : undefined}
                  title={inMonth ? `${MONTH_ABBR[m]} ${d.getDate()} - ${away.length ? away.map(e=>firstName(e.name)).join(", ")+" somewhere unusual" : "everyone where they should be"}` : ""} />;
              })}
            </div>
          </div>
        );
      })}
      <div className="wa-ystates">
        <p className="wa-ystates__h">This year, most often</p>
        {L.states.map((s,i) => (
          <div key={i} className="wa-ystate">
            <span className="wa-ystate__sw" style={s.ids.length ? stripes(s.ids.map(id=>entities.find(e=>e.id===id)).filter(Boolean)) : undefined} />
            <span className="wa-ystate__n">{label(s.ids)}</span>
            <span className="wa-ystate__d">{s.count} {s.count===1?"day":"days"}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ============================================================
   EXCEPTIONS LINE - "who is away", in words, above every view.
   The cheapest answer to the app's core question: it needs no chart at all, and
   it stays readable when a dense view is not. Groups people who are in the SAME
   place so a couple's trip reads as one fact, not two.
   ============================================================ */
function ExceptionsLine({ entities, cursor, ctx }){
  const info = useMemo(() => {
    const st = ctx.statusOn(entities.map(e => e.id), cursor);
    const away = st.unusual;                       // lead with real exceptions only
    const nameOf = (id) => { const e = entities.find(x => x.id === id); return e ? firstName(e.name) : id; };
    const usual = st.expected.map(a => nameOf(a.id) + " " + ctx.placeOf(a.place).name);
    if(!away.length) return { count:0, groups:[], usual };
    // Group by destination; a journey is its own group (the person is mid-move).
    const byKey = new Map();
    for(const a of away){
      const key = a.journey ? ("j:" + a.id) : ("p:" + a.place);
      if(!byKey.has(key)) byKey.set(key, { place:a.place, journey:a.journey, ids:[] });
      byKey.get(key).ids.push(a.id);
    }
    const groups = [...byKey.values()].map(g => {
      // When are they back? Scan forward for the first day this group is home again.
      let back = null;
      const probe = g.ids[0];
      for(let i=1; i<=60; i++){
        const d = addDays(cursor, i);
        if(ctx.dayPlacement(probe, d) === ctx.homeOf[probe]){ back = d; break; }
      }
      return { ...g, names: g.ids.map(nameOf), back };
    });
    return { count: away.length, groups, usual };
  }, [entities, cursor, ctx]);

  const usualTail = info.usual && info.usual.length
    ? <span className="wa-exc__usual"> · {info.usual.join(", ")} (as usual)</span>
    : null;

  if(info.count === 0){
    return (
      <p className="wa-exc">
        <span className="wa-exc--calm">Everyone's where they should be.</span>{usualTail}
      </p>
    );
  }
  const fmtBack = (d) => {
    if(!d) return null;
    const diff = Math.round((d - new Date(cursor.getFullYear(), cursor.getMonth(), cursor.getDate())) / 86400000);
    if(diff <= 7) return "back " + DAY_NAMES[d.getDay()];
    return "back " + MONTH_ABBR[d.getMonth()] + " " + d.getDate();
  };
  return (
    <p className="wa-exc">
      <b>{info.count} {info.count===1?"exception":"exceptions"}:</b>{" "}
      {info.groups.map((g, i) => {
        const who = g.names.length > 2
          ? g.names.slice(0, -1).join(", ") + " + " + g.names[g.names.length - 1]
          : g.names.join(" + ");
        const where = g.journey
          ? ctx.placeOf(g.journey.from).name + " → " + ctx.placeOf(g.journey.to).name
          : ctx.placeOf(g.place).name;
        const back = g.journey ? null : fmtBack(g.back);
        return (
          <span key={i} className="wa-exc__grp">
            {i > 0 && <span className="wa-exc__sep"> &middot; </span>}
            {who} <span className="wa-exc__at">({where}{back ? ", " + back : ""})</span>
          </span>
        );
      })}
      {usualTail}
    </p>
  );
}

/* ============================================================ APP SHELL ============================================================ */
const VIEWS = ["Now","Day","Week","Month","Year"];

function App(){
  const store = useStore();
  const [view,setView]=useState("Now");
  const [cursor,setCursor]=useState(new Date());
  const [tick,setTick]=useState(0);
  const [settingsOpen,setSettingsOpen]=useState(false);
  const [weekMode,setWeekMode]=useState(()=>lsGet("weekMode","story"));
  useEffect(()=>{ lsSet("weekMode", weekMode); },[weekMode]);
  const [monthMode,setMonthMode]=useState(()=>lsGet("monthMode","strips"));
  useEffect(()=>{ lsSet("monthMode", monthMode); },[monthMode]);
  const [nowMode,setNowMode]=useState(()=>lsGet("nowMode","board"));
  useEffect(()=>{ lsSet("nowMode", nowMode); },[nowMode]);
  const [placeSheet,setPlaceSheet]=useState(null);   // { seed } | null
  const [personEdit,setPersonEdit]=useState(null);   // entity | {} | null
  const [placeEdit,setPlaceEdit]=useState(null);     // place | {} | null
  const [toastObj,setToastObj]=useState(null);   // { msg, label?, fn? }
  const toastRef = useRef();
  const toast = useCallback((m)=>{ setToastObj({msg:m}); clearTimeout(toastRef.current); toastRef.current=setTimeout(()=>setToastObj(null),2400); },[]);
  const toastUndo = useCallback((m, fn)=>{ setToastObj({msg:m, label:"Undo", fn}); clearTimeout(toastRef.current); toastRef.current=setTimeout(()=>setToastObj(null),6000); },[]);
  // Swipe-delete routes through here so every deletion offers a few seconds to undo.
  const deleteWithUndo = useCallback((file, item, what)=>{
    store.remove(file, item.id);
    toastUndo("Deleted "+(what||item.name||"item"), ()=>store.restore(file, item));
  },[store.remove, store.restore, toastUndo]);

  useEffect(()=>{ const id=setInterval(()=>setTick(t=>t+1),60000); return ()=>clearInterval(id); },[]);

  // First-run seed: brand-new account (or local preview) gets the roster + places.
  const seededRef = useRef(false);
  useEffect(()=>{
    if(seededRef.current) return;
    if(!store.authReady) return;
    if(CONFIGURED && !store.authed) return;
    if(CONFIGURED && store.sync==="busy") return;   // wait for the initial pull to settle
    const ents = store.data.entities||[], plcs = store.data.places||[];
    if(ents.length===0 && plcs.length===0){
      seededRef.current = true;
      store.seedMany("places", SEED_PLACES);
      store.seedMany("entities", SEED_ENTITIES);
      log("SEED","first-run seed of roster + places");
    } else {
      seededRef.current = true;
      // One-time migration: give anyone without a routine the one that matches
      // what the hardcoded rules were already doing, so the recurring layer
      // becomes editable data without changing a single resolved placement.
      const needs = ents.filter(e => !e.routine);
      if(needs.length){
        needs.forEach(e => store.upsert("entities", {
          id: e.id,
          routine: SEED_ROUTINE[e.id] || { base: e.home || "sanantonio" },
        }));
        log("MIGRATE","seeded routines for "+needs.length+" entities");
      }
    }
  }, [store.authReady, store.authed, store.sync, store.data.entities, store.data.places]);

  // Derived, sorted family + places from the store.
  const entities = useMemo(()=> [...(store.data.entities||[])].sort((a,b)=>(a.order??999)-(b.order??999)), [store.data.entities]);
  const places   = useMemo(()=> [...(store.data.places||[])].sort((a,b)=>(a.order??999)-(b.order??999)), [store.data.places]);
  const homeOf   = useMemo(()=>{ const m={}; entities.forEach(e=>{ m[e.id]=e.home||"sanantonio"; }); return m; }, [entities]);
  const placesById = useMemo(()=>{ const m={}; places.forEach(p=>{ m[p.id]=p; }); return m; }, [places]);
  const placeOrder = useMemo(()=> places.map(p=>p.id), [places]);
  const entById  = useMemo(()=>{ const m={}; entities.forEach(e=>{ m[e.id]=e; }); return m; }, [entities]);
  const resolver = useMemo(()=> makeResolver(store.data.placements||[], homeOf, entById),
                           [store.data.placements, homeOf, entById]);
  const placeOf = useCallback((id)=> placesById[id] || { id, name:id, full:"", kind:"metro" }, [placesById]);

  // Tap a person+date -> edit the existing single-day placement, or start a new pin.
  const onPick = useCallback((entityId, date)=>{
    const key = ymdNum(date);
    const existing = (store.data.placements||[]).find(p =>
      (p.type==="pin" || p.type==="journey") && p.entityId===entityId && p.date && strToYmd(p.date)===key);
    if(existing) setPlaceSheet({ seed: existing });
    else setPlaceSheet({ seed: { type:"pin", entityId, date: ymd(date), place: resolver.placementAt(entityId, date) } });
  }, [store.data.placements, resolver]);

  const ctx = useMemo(()=> ({ ...resolver, placeOf, homeOf, placeOrder, onPick }), [resolver, placeOf, homeOf, placeOrder, onPick]);

  // --- PWA self-update: detect a newer deployed build and offer a one-tap refresh ---
  // Installed PWAs cache the HTML hard; this fetches the deployed file fresh, reads its
  // BUILD stamp, and surfaces a banner when a genuinely newer build is live.
  const [update,setUpdate]=useState(null);   // { ver, build } of a newer deployed build, else null
  const [updMsg,setUpdMsg]=useState("");     // inline status for the Settings "Check for updates" row
  const updTimer = useRef(null);
  // Show a status line for a few seconds then clear it (used for terminal results).
  const flashUpd = useCallback((msg)=>{ setUpdMsg(msg); if(updTimer.current) clearTimeout(updTimer.current); updTimer.current = setTimeout(()=>setUpdMsg(""), 4000); },[]);
  // manual=true is the Settings button: show inline "Checking..." then a result. On
  // launch/resume we check quietly and only surface the banner if there's an update.
  // Detection compares the deployed BUILD (monotonic date stamp) so it never misfires;
  // the deployed APP_VERSION is read alongside it purely to LABEL the update ("v0.5.1").
  const checkUpdate = useCallback(async (manual=false)=>{
    if(manual){ if(updTimer.current) clearTimeout(updTimer.current); setUpdMsg("Checking..."); }
    try{
      const res = await fetch(location.pathname + "?_=" + Date.now(), { cache:"no-store" });
      if(!res.ok){ log("UPDATE","check http "+res.status); if(manual) flashUpd("Couldn't check - are you online?"); return; }
      const html = await res.text();
      const mb = html.match(/const BUILD = "([^"]+)";/);       const rBuild = mb && mb[1];
      const mv = html.match(/const APP_VERSION = "([^"]+)";/); const rVer = mv && mv[1];
      if(rBuild && buildIsNewer(rBuild, BUILD)){ log("UPDATE","newer build live: "+rBuild+" (v"+(rVer||"?")+")"); setUpdate({ ver:rVer, build:rBuild }); if(manual) setUpdMsg(""); }
      else { log("UPDATE","up to date (v"+APP_VERSION+", "+BUILD+")"); setUpdate(null); if(manual) flashUpd("You're on the latest (v"+APP_VERSION+")"); }
    }catch(e){ log("UPDATE","check failed: "+e.message); if(manual) flashUpd("Update check failed"); }
  },[flashUpd]);
  // Check on launch AND on resume AND on a periodic timer - installed PWAs are usually
  // RESUMED from the background, not cold-launched, so a launch-only check means the
  // banner rarely surfaces on its own. Debounced so a burst of resumes only refetches once.
  useEffect(()=>{
    let last=0; const GAP=60*1000;
    const maybe=()=>{ const now=Date.now(); if(now-last<GAP) return; last=now; checkUpdate(false); };
    const t=setTimeout(maybe, 1200);                       // initial launch check
    const onVis=()=>{ if(document.visibilityState==="visible") maybe(); };
    document.addEventListener("visibilitychange", onVis);
    const iv=setInterval(maybe, 20*60*1000);               // periodic while open
    return ()=>{ clearTimeout(t); clearInterval(iv); document.removeEventListener("visibilitychange", onVis); };
  },[checkUpdate]);
  // Apply by navigating to a build-stamped URL so iOS can't serve the cached HTML.
  // Wipe the SW caches first so the new build can never be masked by a cached shell.
  function applyUpdate(){
    const stamp=(update&&update.build)||String(Date.now());
    log("UPDATE","applying -> "+stamp);
    try{ if(navigator.serviceWorker && navigator.serviceWorker.controller) navigator.serviceWorker.controller.postMessage("clearCache"); }catch(_){}
    window.location.replace(location.pathname + "?u=" + encodeURIComponent(stamp));
  }

  const setColor = (id, color) => store.upsert("entities", { id, color });
  const resetColors = () => entities.forEach(e => { if(DEFAULT_COLOR[e.id]) store.upsert("entities", { id:e.id, color:DEFAULT_COLOR[e.id] }); });
  const nextOrder = (arr) => (arr.length ? Math.max(...arr.map(x=>x.order??0)) + 1 : 0);

  const isLive = sameDay(cursor, new Date()) && Math.abs(cursor.getHours() - new Date().getHours()) === 0;

  const label = useMemo(() => {
    if(view==="Year") return `${cursor.getFullYear()}`;
    if(view==="Month") return `${MONTH_NAMES[cursor.getMonth()]} ${cursor.getFullYear()}`;
    if(view==="Week"){
      const sow=startOfWeek(cursor), eow=addDays(sow,6);
      const a=`${MONTH_ABBR[sow.getMonth()]} ${sow.getDate()}`;
      const b=sow.getMonth()===eow.getMonth()?`${eow.getDate()}`:`${MONTH_ABBR[eow.getMonth()]} ${eow.getDate()}`;
      return `${a} – ${b}`;
    }
    return `${DAY_NAMES[cursor.getDay()]}, ${MONTH_ABBR[cursor.getMonth()]} ${cursor.getDate()}`;
  }, [view, cursor, tick]);

  const step = (dir) => {
    if(view==="Year") setCursor(new Date(cursor.getFullYear()+dir, cursor.getMonth(), 1));
    else if(view==="Month") setCursor(new Date(cursor.getFullYear(), cursor.getMonth()+dir, 1));
    else if(view==="Week") setCursor(addDays(cursor, 7*dir));
    else setCursor(addDays(cursor, dir));
  };
  const goToday = () => setCursor(new Date());

  // One toast node for both the login and main renders; shows an Undo button when armed.
  const toastNode = toastObj && (
    <div className={"wa-toast"+(toastObj.fn?" wa-toast--bar":"")}>
      <span>{toastObj.msg}</span>
      {toastObj.fn && <button className="wa-toast__act" onClick={()=>{ toastObj.fn(); clearTimeout(toastRef.current); setToastObj(null); }}>{toastObj.label||"Undo"}</button>}
    </div>
  );

  if(!store.authReady) return <div className="wa-root"><p className="wa-hint" style={{textAlign:"center",marginTop:90}}>Loading...</p></div>;
  if(CONFIGURED && !store.authed) return (
    <div className="wa-root"><Login store={store} toast={toast}/>{toastNode}</div>
  );

  return (
    <div className="wa-root">
      {update &&
        <button className="wa-update" onClick={applyUpdate}>
          <span>Update available <b>(v{update.ver||update.build})</b></span>
          <span className="wa-update__go">Refresh</span>
        </button>}

      <header className="wa-top">
        <div className="wa-brand">
          <span className="wa-brand__mark" aria-hidden="true" />
          <div><h1 className="wa-brand__name">Whereabouts</h1><p className="wa-brand__sub">{label}</p></div>
        </div>
        <nav className="wa-tabs" aria-label="Views">
          {VIEWS.map(v => <button key={v} className={"wa-tab"+(v===view?" is-active":"")} onClick={()=>setView(v)}>{v}</button>)}
        </nav>
        <div className="wa-tools">
          {view!=="Now" && (
            <div className="wa-nav">
              <button className="wa-iconbtn" onClick={()=>step(-1)} aria-label="Previous">{"‹"}</button>
              <button className="wa-today" onClick={goToday}>Today</button>
              <button className="wa-iconbtn" onClick={()=>step(1)} aria-label="Next">{"›"}</button>
            </div>
          )}
          {view==="Now" && <button className="wa-today" onClick={goToday}>Now</button>}
          <button className="wa-iconbtn wa-plus" onClick={()=>setPlaceSheet({ seed:null })} aria-label="Set location">{"+"}</button>
          <button className="wa-iconbtn" onClick={()=>setSettingsOpen(true)} aria-label="Settings">{"⚙"}</button>
        </div>
      </header>

      <ExceptionsLine entities={entities} cursor={cursor} ctx={ctx} />

      <main className="wa-main">
        {view==="Now" && (
          <div className="wa-storywrap">
            <div className="wa-storytoggle">
              <button className={nowMode==="board"?"is-on":""} onClick={()=>setNowMode("board")}>Board</button>
              <button className={nowMode==="map"?"is-on":""} onClick={()=>setNowMode("map")}>Map</button>
            </div>
            {nowMode==="map"
              ? <MapToday entities={entities} cursor={cursor} ctx={ctx} onPick={ctx.onPick} />
              : <NowBoard entities={entities} cursor={cursor} setCursor={setCursor} isLive={isLive} ctx={ctx} />}
          </div>
        )}
        {view==="Day" && <DayView entities={entities} cursor={cursor} ctx={ctx} />}
        {view==="Week" && (
          <div className="wa-storywrap">
            <div className="wa-storytoggle">
              <button className={weekMode==="story"?"is-on":""} onClick={()=>setWeekMode("story")}>Threads</button>
              <button className={weekMode==="table"?"is-on":""} onClick={()=>setWeekMode("table")}>Table</button>
            </div>
            {weekMode==="story"
              ? <StoryView entities={entities}
                  days={Array.from({length:7}).map((_,i)=>addDays(startOfWeek(cursor), i))}
                  ctx={ctx} onPickDay={(d)=>{ setCursor(d); setView("Day"); }} onPick={ctx.onPick} />
              : <WeekView entities={entities} cursor={cursor} ctx={ctx} onPickDay={(d)=>{ setCursor(d); setView("Day"); }} />}
          </div>
        )}
        {view==="Month" && (
          <div className="wa-storywrap">
            <div className="wa-storytoggle">
              <button className={monthMode==="strips"?"is-on":""} onClick={()=>setMonthMode("strips")}>Strips</button>
              <button className={monthMode==="calendar"?"is-on":""} onClick={()=>setMonthMode("calendar")}>Calendar</button>
            </div>
            {monthMode==="strips"
              ? <MonthStrips entities={entities} cursor={cursor} ctx={ctx} onPickDay={(d)=>{ setCursor(d); setView("Day"); }} />
              : <MonthView entities={entities} cursor={cursor} ctx={ctx} onPickDay={(d)=>{ setCursor(d); setView("Day"); }} />}
          </div>
        )}
        {view==="Year" && <YearStates entities={entities} cursor={cursor} ctx={ctx} onPickMonth={(m)=>{ setCursor(new Date(cursor.getFullYear(), m, 1)); setView("Month"); }} />}
      </main>

      <footer className="wa-legend">
        {entities.map((e) => (<span key={e.id} className="wa-legend__item"><Token entity={e} size={20} /><span>{firstName(e.name)}</span></span>))}
      </footer>
      {!CONFIGURED && <p className="wa-previewnote">Local preview - your edits persist in this browser. Sign-in + cross-device sync light up once the backend is configured.</p>}

      {settingsOpen && <Settings store={store} entities={entities} places={places} placeOf={placeOf}
        onColor={setColor} onResetColors={resetColors}
        onEditPerson={(e)=>setPersonEdit(e)} onAddPerson={()=>setPersonEdit({ order: nextOrder(entities) })}
        onEditPlace={(p)=>setPlaceEdit(p)} onAddPlace={()=>setPlaceEdit({ order: nextOrder(places) })}
        onEditPlacement={(p)=>{ setSettingsOpen(false); setPlaceSheet({ seed:p }); }}
        onDeleteRow={deleteWithUndo}
        onClose={()=>setSettingsOpen(false)} onCheckUpdate={checkUpdate} onApplyUpdate={applyUpdate} update={update} updMsg={updMsg} />}

      {placeSheet && <PlacementSheet entities={entities} places={places} store={store} seed={placeSheet.seed} toast={toast} onClose={()=>setPlaceSheet(null)} />}
      {personEdit && <PersonEditor entity={personEdit} places={places} store={store} toast={toast} onClose={()=>setPersonEdit(null)} />}
      {placeEdit && <PlaceEditor place={placeEdit} store={store} toast={toast} onClose={()=>setPlaceEdit(null)} />}

      {toastNode}
    </div>
  );
}

/* ============================================================ MOUNT ============================================================ */
(function(){
  try{
    log("INIT","mounting app");
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App/>);
    log("INIT","mounted");
  }catch(e){
    log("ERROR","mount failed: "+e.message);
    document.getElementById("root").innerHTML = '<div style="padding:40px;font-family:sans-serif"><h2>Startup error</h2><p>'+e.message+'</p></div>';
  }
})();
</script>
<script>
/* Register the offline service worker (relative path -> scoped to the app dir,
   so it works on the project Pages site and later on a root domain). */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js")
      .then(function(r){ try { console.log("[SW] registered " + r.scope); } catch(e){} })
      .catch(function(e){ try { console.log("[SW] register failed " + e.message); } catch(_){} });
  });
}
</script>
