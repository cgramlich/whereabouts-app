<style>
/* ============================================================
   WHEREABOUTS - design system from the prototype: quiet slate
   chrome, white surfaces, family is the only saturated color.
   Fonts: Bricolage Grotesque / Inter / IBM Plex Mono.
   ============================================================ */
.wa-root{
  --canvas:#E7EBF0; --surface:#FFFFFF; --surface-2:#F3F5F9;
  --ink:#19212B; --muted:#6B7480; --line:#D8DDE5;
  --green:#16A34A; --red:#DC2626; --blue:#0284C7;
  --display:'Bricolage Grotesque', system-ui, sans-serif;
  --body:'Inter', system-ui, sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, monospace;
  font-family:var(--body); color:var(--ink); background:var(--canvas);
  min-height:100vh; padding:18px; box-sizing:border-box; -webkit-font-smoothing:antialiased;
}
.wa-root *{ box-sizing:border-box; }
.wa-mono{ font-family:var(--mono); }

/* Header */
.wa-top{ display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  background:var(--surface); border:1px solid var(--line); border-radius:18px;
  padding:14px 16px; box-shadow:0 1px 2px rgba(25,33,43,.04); }
.wa-brand{ display:flex; align-items:center; gap:12px; margin-right:auto; }
.wa-brand__mark{ width:34px; height:34px; border-radius:10px; flex:none;
  background:
    radial-gradient(circle at 30% 32%, #1E40AF 0 5px, transparent 6px),
    radial-gradient(circle at 66% 40%, #DB2777 0 5px, transparent 6px),
    radial-gradient(circle at 42% 70%, #16A34A 0 4px, transparent 5px),
    var(--ink); }
.wa-brand__name{ font-family:var(--display); font-weight:800; font-size:20px; margin:0; letter-spacing:-.02em; }
.wa-brand__sub{ margin:1px 0 0; color:var(--muted); font-size:13px; }

.wa-tabs{ display:flex; gap:4px; background:var(--surface-2); padding:4px; border-radius:12px; }
.wa-tab{ font-family:var(--body); font-weight:600; font-size:13px; color:var(--muted);
  border:none; background:transparent; padding:7px 13px; border-radius:9px; cursor:pointer; }
.wa-tab:hover{ color:var(--ink); }
.wa-tab.is-active{ background:var(--ink); color:#fff; }

.wa-tools{ display:flex; align-items:center; gap:8px; }
.wa-nav{ display:flex; align-items:center; gap:6px; }
.wa-iconbtn{ width:34px; height:34px; border-radius:10px; border:1px solid var(--line);
  background:var(--surface); color:var(--ink); font-size:18px; line-height:1; cursor:pointer; }
.wa-iconbtn:hover{ background:var(--surface-2); }
.wa-iconbtn.wa-plus{ background:var(--ink); color:#fff; border-color:var(--ink); font-size:22px; }
.wa-today{ border:1px solid var(--line); background:var(--surface); color:var(--ink);
  font-family:var(--body); font-weight:600; font-size:13px; padding:8px 12px; border-radius:10px; cursor:pointer; }
.wa-today:hover{ background:var(--surface-2); }

.wa-main{ margin-top:16px; }

/* Generic card + buttons + inputs */
.wa-card{ background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:18px; box-shadow:0 1px 2px rgba(25,33,43,.04); }
.wa-btn{ font-family:var(--body); font-weight:600; font-size:14px; padding:10px 16px; border-radius:10px; border:1px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer; }
.wa-btn:hover{ background:var(--surface-2); }
.wa-btn--primary{ background:var(--ink); color:#fff; border-color:var(--ink); }
.wa-btn--primary:hover{ background:#000; }
.wa-btn--danger{ color:var(--red); border-color:#f3c5bf; background:#fdf1ef; }
.wa-btn--block{ width:100%; display:block; }
.wa-btn:disabled{ opacity:.55; cursor:default; }
.wa-input, .wa-select{ width:100%; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:11px 12px; color:var(--ink); outline:none; font-size:16px; font-family:var(--body); }
.wa-input:focus, .wa-select:focus{ border-color:var(--ink); }
.wa-label{ display:block; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; font-weight:600; }
.wa-field{ margin-bottom:14px; }
.wa-row2{ display:flex; gap:10px; }
.wa-row2>*{ flex:1; }

/* Sync pill */
.wa-sync{ display:inline-flex; align-items:center; gap:8px; font-size:12px; padding:7px 12px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--muted); }
.wa-sync .dot{ width:8px; height:8px; border-radius:50%; background:var(--muted); }
.wa-sync.idle .dot{ background:var(--green); }
.wa-sync.busy .dot{ background:var(--blue); animation:wa-pulse 1s infinite; }
.wa-sync.pending .dot{ background:var(--blue); }
.wa-sync.error{ border-color:#f3c5bf; color:var(--red); }
.wa-sync.error .dot{ background:var(--red); }

/* Data probe (only when configured) */
.wa-probe{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:14px 0; }
.wa-probe__cell{ background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:14px; text-align:center; }
.wa-probe__n{ font-family:var(--display); font-weight:800; font-size:26px; }
.wa-probe__k{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-top:2px; }
.wa-probe__row{ display:flex; gap:10px; flex-wrap:wrap; }

/* Now: scrubber */
.wa-scrub{ background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px 18px; margin-bottom:14px; box-shadow:0 1px 2px rgba(25,33,43,.04); }
.wa-scrub__label{ display:flex; align-items:center; gap:10px; font-size:18px; font-weight:600; }
.wa-livedot{ font-family:var(--body); font-size:11px; font-weight:600; color:var(--green); text-transform:uppercase; letter-spacing:.08em; display:inline-flex; align-items:center; gap:5px; }
.wa-livedot::before{ content:""; width:7px; height:7px; border-radius:50%; background:var(--green); display:inline-block; animation:wa-pulse 1.8s infinite; }
.wa-scrub__hint{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; }
.wa-range{ width:100%; margin:12px 0 4px; accent-color:var(--ink); }
.wa-scrub__ticks{ display:flex; justify-content:space-between; font-family:var(--mono); font-size:11px; color:var(--muted); }

/* Now: headline (the one-glance summary) */
.wa-headline{ margin:2px 4px 12px; font-size:13.5px; color:var(--muted); }
.wa-headline b{ color:var(--ink); font-weight:700; }
.wa-headline .calm{ color:var(--green); font-weight:600; }

/* Now: board */
.wa-board{ display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:14px; }
.wa-place{ background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px; box-shadow:0 1px 2px rgba(25,33,43,.04); animation:wa-rise .35s ease both; }
.wa-place--home{ background:linear-gradient(180deg,#FFFFFF, #FBFCFE); }
.wa-place__head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:12px; }
.wa-place__name{ font-family:var(--display); font-weight:700; font-size:17px; margin:0; letter-spacing:-.01em; }
.wa-place__addr{ display:block; font-size:11px; color:var(--muted); margin-top:1px; }
.wa-place__count{ font-family:var(--mono); font-size:13px; color:var(--muted); }
.wa-place__tokens{ display:flex; flex-wrap:wrap; gap:12px 14px; }
.wa-place__person{ display:flex; flex-direction:column; align-items:center; gap:5px; width:52px; animation:wa-pop .3s ease both; cursor:pointer; }
.wa-place__pname{ font-size:11px; color:var(--muted); text-align:center; line-height:1.1; }
.wa-place__sub{ font-size:9px; color:var(--blue); font-family:var(--mono); text-align:center; line-height:1.1; }

/* Token */
.wa-token{ display:inline-flex; align-items:center; justify-content:center; position:relative; font-family:var(--mono); font-weight:600; flex:none; box-shadow:0 1px 2px rgba(25,33,43,.18); }
.wa-token--pet .wa-paw{ position:absolute; right:-3px; bottom:-3px; }
.wa-token--calm{ box-shadow:none; }
.wa-token--half{ position:relative; }
.wa-token--half::after{ content:""; position:absolute; top:6%; bottom:6%; left:50%; width:2px; transform:translateX(-1px); background:rgba(255,255,255,.7); }
.wa-paw{ filter:drop-shadow(0 0 1px rgba(0,0,0,.25)); }

/* Day view */
.wa-day{ background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:8px 14px 14px; box-shadow:0 1px 2px rgba(25,33,43,.04); }
.wa-day__axis{ display:flex; }
.wa-day__axisPad{ width:96px; flex:none; }
.wa-day__hours{ position:relative; flex:1; height:22px; }
.wa-day__hour{ position:absolute; transform:translateX(-50%); font-family:var(--mono); font-size:10px; color:var(--muted); top:6px; }
.wa-lane{ display:flex; align-items:center; gap:0; height:40px; border-top:1px solid var(--surface-2); cursor:pointer; }
.wa-lane:hover{ background:var(--surface-2); }
.wa-lane__who{ width:96px; flex:none; display:flex; align-items:center; gap:8px; }
.wa-lane__name{ font-size:12px; font-weight:600; }
.wa-lane__track{ position:relative; flex:1; height:30px; }
.wa-seg{ position:absolute; top:3px; height:24px; border-radius:6px; display:flex; align-items:center; padding:0 7px; overflow:hidden; }
.wa-seg--home{ opacity:.6; }
.wa-seg__label{ font-size:11px; font-weight:600; white-space:nowrap; }
.wa-nowline{ position:absolute; top:-2px; bottom:-2px; width:2px; background:var(--green); z-index:3; }
.wa-nowline::before{ content:""; position:absolute; top:-3px; left:-3px; width:8px; height:8px; border-radius:50%; background:var(--green); }

/* Week matrix */
.wa-week__scroll{ overflow-x:auto; background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:0 1px 2px rgba(25,33,43,.04); }
.wa-matrix{ border-collapse:separate; border-spacing:0; width:100%; min-width:560px; }
.wa-matrix th, .wa-matrix td{ padding:0; }
.wa-matrix__corner{ text-align:left; padding:12px 14px; font-size:12px; color:var(--muted); position:sticky; left:0; background:var(--surface); z-index:2; }
.wa-matrix__day{ padding:10px 6px; text-align:center; cursor:pointer; border-bottom:1px solid var(--line); }
.wa-matrix__day.is-today .wa-matrix__dd{ background:var(--ink); color:#fff; border-radius:8px; padding:1px 7px; }
.wa-matrix__dn{ display:block; font-size:11px; color:var(--muted); }
.wa-matrix__dd{ display:inline-block; font-family:var(--display); font-weight:700; font-size:15px; }
.wa-matrix__who{ display:flex; align-items:center; gap:8px; padding:8px 14px; font-size:13px; font-weight:600; position:sticky; left:0; background:var(--surface); z-index:1; border-top:1px solid var(--surface-2); white-space:nowrap; }
.wa-cell{ text-align:center; font-size:12px; font-weight:600; padding:10px 4px; border-top:1px solid var(--surface-2); cursor:pointer; }
.wa-cell--home{ color:var(--muted); font-weight:500; }
.wa-cell--journey{ font-size:10px; line-height:1.15; }
.wa-cell__arr{ color:var(--muted); }

/* Month */
.wa-month{ background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px; box-shadow:0 1px 2px rgba(25,33,43,.04); }
.wa-month__dow{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:6px; }
.wa-month__dow span{ text-align:center; font-size:11px; color:var(--muted); font-weight:600; }
.wa-month__grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
.wa-mday{ aspect-ratio:1/1.05; border:1px solid var(--surface-2); background:var(--surface-2); border-radius:10px; padding:6px; cursor:pointer; display:flex; flex-direction:column; align-items:flex-start; gap:4px; }
.wa-mday.is-out{ opacity:.4; }
.wa-mday.is-today{ outline:2px solid var(--ink); }
.wa-mday.is-trip{ background:rgba(14,165,233,.12); border-color:rgba(14,165,233,.32); }
.wa-mday.is-board{ background:rgba(124,74,45,.12); border-color:rgba(124,74,45,.3); }
.wa-mday__n{ font-family:var(--display); font-weight:700; font-size:13px; }
.wa-mday__dots{ display:flex; flex-wrap:wrap; gap:3px; align-content:flex-start; }
.wa-dot{ width:8px; height:8px; border-radius:50%; }
.wa-dot__more{ font-size:9px; color:var(--muted); font-family:var(--mono); }

/* Year */
.wa-year{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:16px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:18px; box-shadow:0 1px 2px rgba(25,33,43,.04); }
.wa-ymonth__label{ font-family:var(--display); font-weight:700; font-size:14px; margin:0 0 6px; background:none; border:none; cursor:pointer; color:var(--ink); padding:0; }
.wa-ymonth__grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
.wa-ycell{ aspect-ratio:1; border-radius:2px; }

/* Legend + footer note */
.wa-legend{ display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:16px; padding:12px 16px; background:var(--surface); border:1px solid var(--line); border-radius:14px; }
.wa-legend__item{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); }
.wa-hint{ font-size:12.5px; color:var(--muted); line-height:1.5; }
/* Storyline view */
.wa-story{ background:var(--surface); border:1px solid var(--line); border-radius:16px;
  box-shadow:0 1px 2px rgba(25,33,43,.04); display:flex; overflow:hidden; }
.wa-story__labels{ width:96px; flex:none; position:relative; border-right:1px solid var(--surface-2); }
.wa-story__lbl{ position:absolute; left:12px; right:6px; font-size:11px; font-weight:600;
  color:var(--muted); line-height:1.15; }
.wa-story__scroll{ flex:1; overflow-x:auto; }
.wa-story__dn{ font-size:10px; fill:var(--muted); font-family:var(--body); }
.wa-story__dd{ font-size:13px; fill:var(--ink); font-family:var(--display); font-weight:700; }
.wa-story__rule{ stroke:var(--surface-2); stroke-width:1; }
.wa-story__halo{ fill:none; stroke:var(--surface); stroke-width:7.5; stroke-linecap:round; stroke-linejoin:round; }
.wa-story__base{ fill:none; stroke:#CAD1DA; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
.wa-story__mono{ font-family:var(--mono); font-size:8px; font-weight:600; }
.wa-story__more{ position:absolute; }
.wa-storywrap{ position:relative; }
.wa-storywrap .wa-story__more{ position:static; margin:10px 4px 0; font-size:12.5px; color:var(--muted); }
.wa-storytoggle{ display:flex; gap:4px; background:var(--surface-2); padding:3px; border-radius:9px;
  margin:0 0 12px; width:fit-content; }
.wa-storytoggle button{ border:none; background:transparent; color:var(--muted); font-family:var(--body);
  font-weight:600; font-size:12.5px; padding:6px 14px; border-radius:7px; cursor:pointer; }
.wa-storytoggle button.is-on{ background:var(--ink); color:#fff; }

/* Today on a map */
.wa-map{ background:var(--surface); border:1px solid var(--line); border-radius:16px;
  padding:10px; box-shadow:0 1px 2px rgba(25,33,43,.04); }
.wa-map__svg{ width:100%; height:auto; display:block; }
.wa-map__land{ fill:var(--surface-2); stroke:var(--line); stroke-width:1; }
.wa-map__pin{ fill:var(--muted); }
.wa-map__leader{ stroke:var(--line); stroke-width:1.2; }
.wa-map__city{ font-family:var(--body); font-size:11px; font-weight:600; fill:var(--muted); }
.wa-map__mono{ font-family:var(--mono); font-size:9px; font-weight:600; }
.wa-map__off{ border-top:1px solid var(--surface-2); margin-top:6px; padding-top:10px; }
.wa-map__offh{ font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted);
  font-weight:600; margin:0 0 8px; }
.wa-map__offrow{ display:flex; align-items:center; gap:10px; padding:4px 0; }
.wa-map__offwho{ display:flex; gap:5px; flex-wrap:wrap; }
.wa-map__offplace{ font-size:13px; color:var(--ink); font-weight:500; }
.wa-map__tap{ cursor:zoom-in; }
/* Full-screen map: nothing but the map, in either orientation. 100dvh tracks the
   real viewport on mobile as browser chrome hides and shows. */
.wa-mapfull{ position:fixed; inset:0; z-index:80; background:var(--surface);
  display:flex; align-items:center; justify-content:center; cursor:zoom-out;
  padding:calc(env(safe-area-inset-top) + 6px) calc(env(safe-area-inset-right) + 6px)
          calc(env(safe-area-inset-bottom) + 6px) calc(env(safe-area-inset-left) + 6px); }
.wa-mapfull .wa-map__svg{ width:100%; height:100%; max-width:100%; max-height:100%; }
.wa-mapfull__x{ position:absolute; top:calc(env(safe-area-inset-top) + 10px);
  right:calc(env(safe-area-inset-right) + 12px); width:40px; height:40px; border-radius:50%;
  border:1px solid var(--line); background:var(--surface); color:var(--muted);
  font-size:22px; line-height:1; cursor:pointer; }
.wa-mapfull__off{ position:absolute; left:0; right:0; bottom:calc(env(safe-area-inset-bottom) + 8px);
  text-align:center; margin:0; font-size:12.5px; color:var(--muted); pointer-events:none; }
@media (min-width:100px) and (orientation:landscape){
  .wa-mapfull{ padding:6px; }
}

/* Routine editor - a day-override row */
.wa-dayov{ display:grid; grid-template-columns:1fr 1.2fr .9fr .9fr 1.2fr auto; gap:5px;
  align-items:center; margin-bottom:6px; }
.wa-dayov .wa-select{ padding:7px 8px; font-size:12.5px; }

/* Month strips - one ribbon per person, ink only on away days */
.wa-strips{ background:var(--surface); border:1px solid var(--line); border-radius:16px;
  padding:14px; box-shadow:0 1px 2px rgba(25,33,43,.04); }
.wa-strip{ display:flex; align-items:center; gap:8px; height:26px; }
.wa-strip--head{ height:16px; }
.wa-strip__who{ width:92px; flex:none; display:flex; align-items:center; gap:7px;
  font-size:12px; font-weight:600; white-space:nowrap; overflow:hidden; }
.wa-strip__cells{ flex:1; display:grid; gap:1px; height:18px; }
.wa-strip--head .wa-strip__cells{ height:14px; }
.wa-strip__c{ border:none; padding:0; border-radius:2px; background:var(--surface-2); cursor:pointer; }
.wa-strip__c.is-away{ border-radius:2px; }
.wa-strip__c.is-wk{ box-shadow:inset 1px 0 0 var(--line); }
.wa-strip__num{ font-family:var(--mono); font-size:8px; color:var(--muted); text-align:center; line-height:14px; }

/* Year states */
.wa-ycell.is-out{ opacity:.25; }
.wa-ycell.is-calm{ background:var(--surface-2); }
.wa-ystates{ grid-column:1/-1; border-top:1px solid var(--surface-2); margin-top:4px; padding-top:14px; }
.wa-ystates__h{ font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted);
  font-weight:600; margin:0 0 10px; }
.wa-ystate{ display:flex; align-items:center; gap:10px; padding:5px 0; font-size:13px; }

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

/* ============================================================ LOGGING ============================================================ */
const LOG_CAP = 600;
const LOG = [];
// User-facing semantic version (MAJOR.MINOR.PATCH). This is what shows in Settings,
// the update prompts, and the footers - a real version, not a build date. Bump it on
// every deploy: PATCH for a fix, MINOR for a feature, MAJOR for a big milestone.
const APP_VERSION = "0.12.1";
// Internal build stamp. Bump on every deploy too (today's date + a counter), and keep
// it in lockstep with VERSION in sw.js. This is what the updater actually COMPARES
// (it's monotonic, so detection never misfires) and what cache-busts the reload;
// APP_VERSION above is the friendly label shown to users.
const BUILD = "2026-08-08.2";
// Compare two build stamps of the form "YYYY-MM-DD.N". A plain string compare is wrong
// (the counter isn't zero-padded, so ".11" < ".9" lexically); split on - and . into
// numeric fields and compare left to right. True iff `a` is strictly newer than `b`.
// Used by the updater so we only offer a genuinely newer deployed build.
function buildIsNewer(a, b){
  const parse = s => String(s||"").split(/[-.]/).map(n=>parseInt(n,10)||0);
  const pa=parse(a), pb=parse(b), len=Math.max(pa.length,pb.length);
  for(let i=0;i<len;i++){ const x=pa[i]||0, y=pb[i]||0; if(x>y) return true; if(x<y) return false; }
  return false;
}
function log(tag, msg){
  const line = { t: new Date().toISOString().slice(11,19), tag, msg: String(msg) };
  LOG.push(line);
  if (LOG.length > LOG_CAP) LOG.shift();
  try { console.log("[" + tag + "] " + line.msg); } catch(e){}
}
log("INIT", "script booting - v"+APP_VERSION+" (build "+BUILD+")");

/* ============================================================ UTILITIES ============================================================ */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const nowISO = () => new Date().toISOString();

const DAY_NAMES = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const MONTH_ABBR = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const sameDay = (a,b) => a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
function startOfWeek(d){ const x=new Date(d); x.setDate(x.getDate()-x.getDay()); x.setHours(0,0,0,0); return x; }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
const ymd = (d) => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function parseYmd(s){ const a=(s||"").split("-").map(Number); return new Date(a[0], (a[1]||1)-1, a[2]||1); }
function fmtYmd(s){ const d=parseYmd(s); return `${MONTH_ABBR[d.getMonth()]} ${d.getDate()}`; }

/* Color utilities */
function hexToRgb(hex){
  const h = (hex||"#000").replace("#",""); const v = h.length===3 ? h.split("").map(c=>c+c).join("") : h;
  return { r:parseInt(v.slice(0,2),16), g:parseInt(v.slice(2,4),16), b:parseInt(v.slice(4,6),16) };
}
function rgba(hex, a){ const { r,g,b } = hexToRgb(hex); return `rgba(${r}, ${g}, ${b}, ${a})`; }
function readableText(hex){ const { r,g,b } = hexToRgb(hex); const lum = (0.299*r + 0.587*g + 0.114*b)/255; return lum > 0.62 ? "#19212B" : "#FFFFFF"; }
function firstName(name){ const p=(name||"").split(" "); const last=p[p.length-1]; return /^(jr|sr|ii|iii)\.?$/i.test(last) && p.length>1 ? `${p[0]} ${last}` : p[0]; }

/* ============================================================
   SEED DATA - the family + places. On a brand-new account (or local
   preview) these populate the entities/places collections once; after
   that everything is edited in the app and lives in the store.
   ============================================================ */
// Molly AND Hank are based in DALLAS - that is where each goes when school is
// out - so Auburn and Boston correctly render as "away" (and, under the
// three-state model, as "expected" during term). Keep in step with the cloud
// `entities` rows.
const HOME_OF = {
  chris:"sanantonio", kristin:"sanantonio", jenna:"austin", hank:"dallas", cjr:"dallas",
  molly:"dallas", samuel:"dallas", bellarose:"sanantonio", gracieann:"sanantonio", sophia:"sanantonio",
  gus:"sanantonio", graham:"sanantonio", lola:"sanantonio",
};
const SEED_ROSTER = [
  { id:"chris",     name:"Pops",      short:"Po", kind:"person", color:"#1E40AF" },
  { id:"kristin",   name:"Kristin",   short:"Kr", kind:"person", color:"#DB2777" },
  { id:"jenna",     name:"Jenna",     short:"Je", kind:"person", color:"#0D9488" },
  { id:"cjr",       name:"Chris Jr.", short:"CJ", kind:"person", color:"#EA580C" },
  { id:"samuel",    name:"Samuel",    short:"Sa", kind:"person", color:"#6D28D9" },
  { id:"hank",      name:"Hank",      short:"Ha", kind:"person", color:"#DC2626" },
  // Olive, not amber: amber collided with Hank's red + CJR's orange, a warm triple
  // that is indistinguishable at token size and collapses entirely under protanopia.
  { id:"molly",     name:"Molly",     short:"Mo", kind:"person", color:"#A16207" },
  // Magenta, not rose: rose differed from Kristin's pink only in LIGHTNESS, so the
  // two merged at a glance. Separating by hue survives small sizes and distance.
  { id:"bellarose", name:"Bellarose", short:"Br", kind:"person", color:"#C026D3" },
  { id:"gracieann", name:"Gracieann", short:"Gr", kind:"person", color:"#0EA5E9" },
  { id:"sophia",    name:"Sophia",    short:"So", kind:"person", color:"#16A34A" },
  { id:"gus",       name:"Gus",       short:"Gu", kind:"pet",    color:"#18181B" },
  { id:"graham",    name:"Graham",    short:"Gh", kind:"pet",    color:"#7C4A2D" },
  { id:"lola",      name:"Lola",      short:"Lo", kind:"pet",    color:"#FFFFFF" },
];
// The routines the app shipped with, so migrating an existing family reproduces
// exactly what the old hardcoded rules did. Must be declared BEFORE SEED_ENTITIES,
// which reads it (const has no hoisting - referencing it earlier throws).
const SEED_ROUTINE = {
  chris:     { base:"sanantonio", days:{ "2":{place:"dallas",from:10,to:24,outside:"sanantonio"},
                                          "3":{place:"office",from:8,to:18,outside:"dallas"},
                                          "4":{place:"dallas",from:0,to:10,outside:"sanantonio"} } },
  kristin:   { base:"sanantonio" },
  jenna:     { base:"austin" },
  cjr:       { base:"dallas" },
  samuel:    { base:"dallas" },
  hank:      { base:"boston" },
  molly:     { base:"auburn" },
  bellarose: { base:"sanantonio" },
  gracieann: { base:"sanantonio" },
  sophia:    { base:"sanantonio" },
  gus:       { base:"sanantonio", follows:{ entityId:"chris", fallback:"dallas" } },
  graham:    { base:"sanantonio", follows:{ entityId:"chris", fallback:"dallas" } },
  // Lola rides with Kristin. Because Kristin's own trips are all trips WITH Chris,
  // and Lola stays behind on those, the fallback is simply San Antonio. LIMITATION:
  // if Kristin ever travels solo, this keeps Lola home rather than taking her -
  // pin Lola for that trip, or extend `follows` with a "go anywhere" mode.
  lola:      { base:"sanantonio", follows:{ entityId:"kristin", fallback:"sanantonio" } },
};

const SEED_ENTITIES = SEED_ROSTER.map((e, i) => ({
  ...e, home: HOME_OF[e.id] || "sanantonio", order: i,
  routine: SEED_ROUTINE[e.id] || { base: HOME_OF[e.id] || "sanantonio" },
}));

const SEED_PLACE_LIST = [
  { id:"sanantonio",  name:"San Antonio", full:"Spring Branch · San Antonio area", kind:"metro" },
  { id:"dallas",      name:"Dallas",      full:"Dallas, TX (house & apartments)",       kind:"metro" },
  { id:"austin",      name:"Austin",      full:"Austin · Buda, TX",                kind:"metro" },
  { id:"boston",      name:"Boston",      full:"Boston, MA · school & summer work", kind:"metro" },
  { id:"dads",        name:"Dad's",       full:"Sophia's dad's house",                  kind:"custody" },
  { id:"office",      name:"Office",      full:"At the office",                         kind:"work" },
  { id:"auburn",      name:"Auburn",      full:"Auburn, AL · school",               kind:"school" },
  { id:"jordanvalley",name:"Boarding",    full:"Jordan Valley Retrievers (kennel)",     kind:"boarding" },
];
const SEED_PLACES = SEED_PLACE_LIST.map((p, i) => ({ ...p, order: i }));
const PLACE_KINDS = ["metro","work","custody","school","boarding","other"];
const DEFAULT_COLOR = { chris:"#1E40AF", kristin:"#DB2777", jenna:"#0D9488", cjr:"#EA580C", samuel:"#6D28D9",
  hank:"#DC2626", molly:"#A16207", bellarose:"#C026D3", gracieann:"#0EA5E9", sophia:"#16A34A",
  gus:"#18181B", graham:"#7C4A2D", lola:"#FFFFFF" };

/* ============================================================
   PLACEMENT RESOLVER. Precedence (most specific first):
   journey > pin > trip > custody > recurring rule.
   journey/pin/trip come from the store's `placements` collection;
   custody + the per-person rule are code-level defaults for now
   (slice 3b turns them into editable schedules).
   ============================================================ */
function ymdNum(date){ return date.getFullYear()*10000 + (date.getMonth()+1)*100 + date.getDate(); }
function strToYmd(s){ const a=s.split("-").map(Number); return a[0]*10000 + a[1]*100 + a[2]; }
const isSummer = (d) => { const m=d.getMonth(); return m>=5 && m<=7; };
const isTerm = (d) => !isSummer(d);
// No custody rotation is configured. The prototype's placeholder (Sophia at her
// dad's on alternating weekends) was a GUESS and is switched off: per Chris
// (2026-08-01) Sophia is in San Antonio for the rest of 2026, until further
// notice. Individual away-days can still be entered as pins/trips. Slice 3b adds
// a real, editable custody schedule (rotation + single-day exceptions).
function custodyPlace(entityId, date){
  return null;
}
// Recurring per-person default. Editable in 3b.
// Sun=0 Mon=1 Tue=2 Wed=3 Thu=4 Fri=5 Sat=6
function rulePlace(entityId, date){
  const day = date.getDay();
  const h = date.getHours();
  switch(entityId){
    // Dallas from Tuesday morning to Thursday morning each week, in the office on
    // Wednesday; San Antonio the rest of the time. Trips already entered override
    // this. Some weekends are also Dallas - to be entered individually later.
    case "chris":
      if(day===2) return h < 10 ? "sanantonio" : "dallas";      // Tue: up in the morning
      if(day===3) return (h >= 8 && h < 18) ? "office" : "dallas"; // Wed: office day
      if(day===4) return h < 10 ? "dallas" : "sanantonio";      // Thu: home in the morning
      return "sanantonio";
    case "kristin": return "sanantonio";
    // Austin through end of May 2027 (law school). The prototype's summer-in-Dallas
    // clerking pattern was a guess and is removed. Beyond May 2027 is UNKNOWN -
    // revisit rather than let this quietly keep asserting Austin forever.
    case "jenna":   return "austin";
    case "cjr":     return "dallas";
    case "hank":    return "boston";
    // Molly's default is Auburn (school). Breaks + summer are entered as real
    // date-range placements (Dallas), which override this rule.
    case "molly":   return "auburn";
    case "samuel":  return "dallas";
    case "bellarose":
    case "gracieann":
    case "sophia":  return "sanantonio";
    // Gus + Graham normally follow Chris - resolved in placementAt (which can see
    // his trips, not just this rule). These are only a safety net.
    case "gus":
    case "graham":  return "dallas";
    case "lola":    return "sanantonio";
    default:        return HOME_OF[entityId] || "sanantonio";
  }
}

/* ============================================================
   ROUTINES AS DATA (slice 3b)
   A person's recurring pattern lives on their entity record, so it is EDITABLE
   in the app instead of being a switch statement in this file:
     routine = {
       base: placeId,                       // "usually in ___"
       days: { "2": { place, from, to, outside } },   // 0=Sun .. 6=Sat
       follows: { entityId, fallback }      // pets: be with someone, else fallback
     }
     custody = { place, pattern, anchor }   // "alt-weekends" | "week-on-off"
   Entities saved before this existed have no `routine`; they fall back to the
   legacy rulePlace switch so nothing changes until they are migrated.
   ============================================================ */
const WEEKDAY_KEYS = ["0","1","2","3","4","5","6"];

function evalRoutine(ent, date, resolveFollowed){
  const r = ent && ent.routine;
  if(!r) return null;                                   // -> caller uses legacy
  if(r.follows && r.follows.entityId){
    const p = resolveFollowed(r.follows.entityId, date);
    const fb = r.follows.fallback || ent.home;
    // Be with them where you can be (your own home, or the fallback); the office
    // and a trip abroad are no place for a dog, so those land on the fallback.
    return (p === ent.home || p === fb) ? p : fb;
  }
  const ov = r.days && r.days[String(date.getDay())];
  if(ov && ov.place){
    const from = (ov.from == null) ? 0 : ov.from;
    const to   = (ov.to   == null) ? 24 : ov.to;
    const h = date.getHours();
    if(h >= from && h < to) return ov.place;
    return ov.outside || r.base || ent.home;
  }
  return r.base || ent.home;
}

function evalCustody(ent, date){
  const c = ent && ent.custody;
  if(!c || !c.place || !c.pattern || c.pattern === "none") return null;
  const day = date.getDay();
  const anchor = c.anchor ? parseYmd(c.anchor) : new Date(date.getFullYear(), 0, 1);
  const weeks = Math.floor((date - anchor) / (7*86400000));
  if(c.pattern === "alt-weekends"){
    if(day !== 0 && day !== 6) return null;
    return (((weeks % 2) + 2) % 2 === 0) ? c.place : null;
  }
  if(c.pattern === "week-on-off"){
    return (((weeks % 2) + 2) % 2 === 0) ? c.place : null;
  }
  return null;
}

// The routines the app shipped with, so migrating an existing family reproduces
// exactly what the old hardcoded rules did.

// Where the ROUTINE alone would put someone - rules and custody only, ignoring
// pins, trips and journeys. Comparing this against the real placement is what
// separates "at school / at the office, as always" from "actually somewhere
// unusual". Recursive for the dogs so their routine follows Chris's routine, not
// his trip.
function routineAt(entityId, date){
  const cust = custodyPlace(entityId, date); if(cust) return cust;
  if(entityId === "gus" || entityId === "graham"){
    return routineAt("chris", date) === "sanantonio" ? "sanantonio" : "dallas";
  }
  return rulePlace(entityId, date);
}

// Build a resolver bound to the current placements + home-base map.
// INDEXED BY ENTITY at construction: pins and journeys become O(1) date lookups
// and trips only scan that one entity's trips. The previous version scanned the
// whole placements array three times per call, and dayPlacement probes 11 hours -
// so a single Year render (13 entities x 42 cells x 12 months) cost roughly
// 216,000 array scans. Build this ONCE per placements change, never in a render.
// `entById` carries each person's EDITABLE routine/custody; entities saved before
// slice 3b have none, and fall back to the legacy rulePlace switch.
function makeResolver(placements, homeOf, entById){
  const list = placements || [];
  const byEntity = {};                 // entityId -> { pins:{ymd:place}, journeys:{ymd:j}, trips:[] }
  const allTrips = [];
  function bucket(id){
    return byEntity[id] || (byEntity[id] = { pins:{}, journeys:{}, trips:[] });
  }
  for(const p of list){
    if(p.type === "trip"){
      allTrips.push(p);
      const ids = p.entityIds || (p.entityId ? [p.entityId] : []);
      for(const id of ids) bucket(id).trips.push(p);
    } else if(p.type === "pin" && p.entityId && p.date){
      bucket(p.entityId).pins[strToYmd(p.date)] = p.place;
    } else if(p.type === "journey" && p.entityId && p.date){
      bucket(p.entityId).journeys[strToYmd(p.date)] = p;
    }
  }

  function journeyOf(entityId, date){
    const b = byEntity[entityId]; if(!b) return null;
    return b.journeys[ymdNum(date)] || null;
  }
  function pinPlace(entityId, date){
    const b = byEntity[entityId]; if(!b) return null;
    const v = b.pins[ymdNum(date)];
    return v === undefined ? null : v;
  }
  function tripPlace(entityId, date){
    const b = byEntity[entityId]; if(!b) return null;
    const key = ymdNum(date);
    for(const t of b.trips){
      if(key >= strToYmd(t.start) && key <= strToYmd(t.end)) return t.place;
    }
    return null;
  }
  function anyTrip(date){
    const key = ymdNum(date);
    return allTrips.some(t => key >= strToYmd(t.start) && key <= strToYmd(t.end));
  }
  const ents = entById || {};

  // The recurring layer: the person's own editable routine if they have one,
  // otherwise the legacy hardcoded rule. A `follows` routine resolves against the
  // followed person's REAL placement, so the dogs land in Dallas when Chris is
  // away on a trip, not just when his routine says Dallas.
  function recurringAt(entityId, date){
    const ent = ents[entityId];
    const cust = evalCustody(ent, date); if(cust) return cust;
    const viaRoutine = evalRoutine(ent, date, (id, d) => placementAt(id, d));
    if(viaRoutine) return viaRoutine;
    const legacyCust = custodyPlace(entityId, date); if(legacyCust) return legacyCust;
    if(entityId === "gus" || entityId === "graham"){
      return placementAt("chris", date) === "sanantonio" ? "sanantonio" : "dallas";
    }
    return rulePlace(entityId, date);
  }

  function placementAt(entityId, date){
    const h = date.getHours();
    const jr = journeyOf(entityId, date); if(jr) return h < 14 ? jr.from : jr.to;
    const pin = pinPlace(entityId, date); if(pin) return pin;
    const trip = tripPlace(entityId, date); if(trip) return trip;
    return recurringAt(entityId, date);
  }
  // Memoized: each (entity, day) is computed once for the life of this resolver.
  // The resolver is rebuilt whenever placements or home bases change, so the cache
  // invalidates itself - no stale reads. This is what makes Month/Year cheap, since
  // each uncached call probes 11 hours.
  const dayCache = new Map();
  function dayPlacement(entityId, date){
    const key = entityId + ":" + ymdNum(date);
    const hit = dayCache.get(key);
    if(hit !== undefined) return hit;
    const y = date.getFullYear(), m = date.getMonth(), d = date.getDate();
    const counts = {};
    for(let h=8; h<=18; h++){
      const loc = placementAt(entityId, new Date(y, m, d, h));
      counts[loc] = (counts[loc]||0) + 1;
    }
    const home = homeOf[entityId];
    let best = placementAt(entityId, new Date(y, m, d, 12));
    let bestN = -1;
    for(const [loc,n] of Object.entries(counts)){
      // Bias toward surfacing an away-place even when home dominates the hours.
      const weight = loc===home ? n*0.5 : n;
      if(weight > bestN){ bestN = weight; best = loc; }
    }
    dayCache.set(key, best);
    return best;
  }

  // Routine-only resolution (no pins/trips/journeys), used to decide whether the
  // real placement is "expected" or "unusual". Mirrors recurringAt but the
  // `follows` lookup resolves against the followed person's ROUTINE, so the dogs'
  // routine is "with Chris as usual" rather than "wherever his trip took him".
  function routineOnly(entityId, date){
    const ent = ents[entityId];
    const cust = evalCustody(ent, date); if(cust) return cust;
    const viaRoutine = evalRoutine(ent, date, (id, d) => routineOnly(id, d));
    if(viaRoutine) return viaRoutine;
    return routineAt(entityId, date);                  // legacy path
  }

  // The routine's headline place for a day, same aggregation as dayPlacement.
  const routineCache = new Map();
  function dayRoutine(entityId, date){
    const key = entityId + ":" + ymdNum(date);
    const hit = routineCache.get(key);
    if(hit !== undefined) return hit;
    const y = date.getFullYear(), m = date.getMonth(), d = date.getDate();
    const counts = {};
    for(let h=8; h<=18; h++){
      const loc = routineOnly(entityId, new Date(y, m, d, h));
      counts[loc] = (counts[loc]||0) + 1;
    }
    const home = homeOf[entityId];
    let best = routineOnly(entityId, new Date(y, m, d, 12));
    let bestN = -1;
    for(const [loc,n] of Object.entries(counts)){
      const weight = loc===home ? n*0.5 : n;
      if(weight > bestN){ bestN = weight; best = loc; }
    }
    routineCache.set(key, best);
    return best;
  }

  // THREE states, not two:
  //   home     - in their own home base            -> quiet, no ink
  //   expected - away, but where the routine says   -> muted (school, the office)
  //   unusual  - away, and NOT where routine says   -> full color (a real exception)
  // This is what stops a semester at school, or a standing weekly commute, from
  // screaming "away" 250 days a year and drowning out the calm/scattered signal.
  function dayState(entityId, date){
    const actual = dayPlacement(entityId, date);
    if(actual === homeOf[entityId]) return "home";
    return actual === dayRoutine(entityId, date) ? "expected" : "unusual";
  }
  function stateAt(entityId, date){
    const actual = placementAt(entityId, date);
    if(actual === homeOf[entityId]) return "home";
    return actual === routineOnly(entityId, date) ? "expected" : "unusual";
  }

  // Split a day's roster into the two away buckets, in roster order.
  const statusCache = new Map();
  function statusOn(entityIds, date){
    const key = ymdNum(date);
    const hit = statusCache.get(key);
    if(hit !== undefined) return hit;
    const unusual = [], expected = [];
    for(const id of entityIds){
      const st = dayState(id, date);
      if(st === "home") continue;
      const row = { id, place: dayPlacement(id, date), journey: journeyOf(id, date) };
      (st === "unusual" ? unusual : expected).push(row);
    }
    const out = { unusual, expected };
    statusCache.set(key, out);
    return out;
  }
  // Everyone not in their own home base, regardless of why.
  function awayOn(entityIds, date){
    const s = statusOn(entityIds, date);
    return s.unusual.concat(s.expected);
  }

  return { journeyOf, placementAt, dayPlacement, dayRoutine, dayState, stateAt,
           anyTrip, awayOn, statusOn };
}

async function collGet(file){

  if(!token) throw new Error("Not signed in");
  log("API","GET "+file);

    throw new Error("Load failed ("+r.status+")"); }
  const j = await r.json();
  const arr = Array.isArray(j) ? j : [];
  log("API","GET "+file+" ok ("+arr.length+" rows)");

  if(!token) throw new Error("Not signed in");

    method:"PUT",
    headers:{ "Authorization":"Bearer "+token, "Content-Type":"application/json" },
    body: JSON.stringify(data)

  if(!r.ok){ const t=await r.text(); log("ERROR","PUT "+file+" "+r.status+" "+t.slice(0,160));
    if(r.status===401) throw new Error("Session expired - sign in again.");
    throw new Error("Save failed ("+r.status+")"); }
  log("API","PUT "+file+" ok");
  return true;
}

/* ============================================================ DATA STORE HOOK ============================================================ */
function useStore(){
  const [cfg, setCfg] = useState(() => lsGet("cfg", { appName:"Whereabouts" }));
  const [data, setData] = useState(() => { const d={}; FILES.forEach(f => d[f]=lsGet("cache:"+f, [])); return d; });
  const [dirty, setDirty] = useState(() => lsGet("dirty", {}));
  const [sync, setSync] = useState("idle");
  const [syncMsg, setSyncMsg] = useState("");
  const [online, setOnline] = useState(navigator.onLine);
  const [authed, setAuthed] = useState(false);
  const [authEmail, setAuthEmail] = useState("");
  const [authReady, setAuthReady] = useState(false);
  const dirtyRef = useRef(dirty); dirtyRef.current = dirty;
  const dataRef = useRef(data); dataRef.current = data;
  const authedRef = useRef(false);

  const saveCfg = useCallback((next) => { setCfg(next); lsSet("cfg", next); }, []);
  const markDirty = useCallback((file, rows) => {
    lsSet("cache:"+file, rows);
    // dirtyRef is updated SYNCHRONOUSLY, not left to the re-render. Two bugs
    // otherwise: (1) callers invoke pushDirty() in the same tick and it reads
    // dirtyRef.current to pick what to push, so the just-dirtied file was
    // skipped until the 30s interval retried; (2) back-to-back calls in one
    // tick (first-run seeding does places then entities) each spread the SAME
    // stale map, so the last setDirty/lsSet dropped the earlier file's flag -
    // a file with real local changes could read clean and be rolled back by
    // the next pull.
    const nd = { ...dirtyRef.current, [file]:true }; dirtyRef.current = nd; setDirty(nd); lsSet("dirty", nd);
  }, []);

  const pushDirty = useCallback(async () => {
    if(!authedRef.current){ return; }
    if(!navigator.onLine){ log("SYNC","offline; deferring push"); setSync("pending"); return; }
    const pending = FILES.filter(f => dirtyRef.current[f]);
    if(pending.length===0){ setSync("idle"); return; }
    setSync("busy"); setSyncMsg("Saving...");
    try{
      for(const f of pending){
        await collPut(f, dataRef.current[f]);
        const nd = { ...dirtyRef.current, [f]:false }; dirtyRef.current = nd; setDirty(nd); lsSet("dirty", nd);
      }
      setSync("idle"); setSyncMsg(""); log("SYNC","push complete");
    }catch(e){ setSync("error"); setSyncMsg(e.message||"Sync failed"); log("ERROR","pushDirty: "+e.message); }
  }, []);

  const pull = useCallback(async () => {
    if(!authedRef.current || !navigator.onLine) return;
    setSync("busy"); setSyncMsg("Syncing...");
    try{
      const nextData = { ...dataRef.current };
      for(const f of FILES){
        if(dirtyRef.current[f]){ log("SYNC","skip pull "+f+" (dirty)"); continue; }
        const arr = await collGet(f);
        nextData[f] = arr; lsSet("cache:"+f, arr);
      }
      dataRef.current = nextData; setData(nextData);
      setSync(FILES.some(f=>dirtyRef.current[f])?"pending":"idle"); setSyncMsg("");
      log("SYNC","pull complete");
      await pushDirty();
    }catch(e){ setSync("error"); setSyncMsg(e.message||"Sync failed"); log("ERROR","pull: "+e.message); }
  }, [pushDirty]);

  const applySession = useCallback((session) => {
    const ok = !!session; const was = authedRef.current;
    authedRef.current = ok; setAuthed(ok);
    setAuthEmail(ok && session.user ? (session.user.email||"") : "");
    if(ok && !was){ log("AUTH","session active"); pull(); }
    else if(!ok){ log("AUTH","no session"); }
  }, [pull]);

  const signIn = useCallback(async (email, password) => {
    const { error } = await supa.auth.signInWithPassword({ email:(email||"").trim(), password:password||"" });
    if(error){ log("AUTH","sign-in failed: "+error.message); throw new Error(error.message); }
    log("AUTH","sign-in ok");
  }, []);
  const signOut = useCallback(async () => { try{ await supa.auth.signOut(); }catch(e){ log("ERROR","signOut: "+e.message); } log("AUTH","signed out"); }, []);
  const signUp = useCallback(async (email, password) => {
    const redirectTo = window.location.origin + window.location.pathname;
    const { data, error } = await supa.auth.signUp({ email:(email||"").trim(), password:password||"", options:{ emailRedirectTo: redirectTo } });
    if(error){ log("AUTH","sign-up failed: "+error.message); throw new Error(error.message); }
    const needsConfirm = !data.session; log("AUTH","sign-up ok needsConfirm="+needsConfirm);
    return { needsConfirm };
  }, []);

  useEffect(() => {
    if(!CONFIGURED){ setAuthReady(true); return; }
    let sub = null;
    (async () => {
      try{ const { data } = await supa.auth.getSession(); applySession(data.session); }
      catch(e){ log("ERROR","getSession: "+e.message); }
      setAuthReady(true);
      const res = supa.auth.onAuthStateChange((_evt, session) => { applySession(session); });
      sub = res.data ? res.data.subscription : null;
    })();
    return () => { if(sub) sub.unsubscribe(); };
  }, [applySession]);

  useEffect(() => {
    const on = () => { setOnline(true); log("SYNC","online"); pushDirty(); };
    const off = () => { setOnline(false); log("SYNC","offline"); setSync("pending"); };
    window.addEventListener("online", on); window.addEventListener("offline", off);
    return () => { window.removeEventListener("online", on); window.removeEventListener("offline", off); };
  }, [pushDirty]);

  useEffect(() => {
    const id = setInterval(() => { if(FILES.some(f=>dirtyRef.current[f]) && navigator.onLine) pushDirty(); }, 30000);
    return () => clearInterval(id);
  }, [pushDirty]);

  const upsert = useCallback((file, row) => {
    const list = dataRef.current[file] || [];
    const i = list.findIndex(x => x.id === row.id);
    let merged;
    if(i>=0){ merged = { ...list[i], ...row, updatedAt:nowISO() }; }
    else { merged = { ...row, id: row.id||uid(), createdAt:nowISO(), updatedAt:nowISO() }; }
    let next;
    if(i>=0){ next = list.slice(); next[i] = merged; } else { next = [merged, ...list]; }
    const nd = { ...dataRef.current, [file]:next }; dataRef.current = nd; setData(nd);
    markDirty(file, next);
    log("SAVE", file+" upsert "+(row.name||row.id||row.type||"").toString().slice(0,40));
    pushDirty();
    return merged;
  }, [markDirty, pushDirty]);

  // Insert several rows in one write (used by first-run seeding).
  const seedMany = useCallback((file, rows) => {
    const existing = dataRef.current[file] || [];
    const next = [...existing, ...rows.map(r => ({ ...r, createdAt:nowISO(), updatedAt:nowISO() }))];
    const nd = { ...dataRef.current, [file]:next }; dataRef.current = nd; setData(nd);
    markDirty(file, next);
    log("SEED", file+" seeded "+rows.length+" rows");
    pushDirty();
  }, [markDirty, pushDirty]);

  const remove = useCallback((file, id) => {
    const next = (dataRef.current[file]||[]).filter(x => x.id !== id);
    const nd = { ...dataRef.current, [file]:next }; dataRef.current = nd; setData(nd);
    markDirty(file, next);
    log("SAVE", file+" delete "+id); pushDirty();
  }, [markDirty, pushDirty]);

  // Re-insert a previously-removed item exactly as it was (keeps id + order, so it
  // returns to its original spot). Used by Undo after a swipe-delete.
  const restore = useCallback((file, item) => {
    const cur = dataRef.current[file] || [];
    if(cur.some(x => x.id === item.id)){ log("SAVE","restore skipped, "+file+" "+item.id+" already present"); return; }
    const next = [...cur, item];
    const nd = { ...dataRef.current, [file]:next }; dataRef.current = nd; setData(nd);
    markDirty(file, next);
    log("SAVE", file+" restore "+item.id); pushDirty();
  }, [markDirty, pushDirty]);

  // Discard this device's local copy and re-pull the cloud as authoritative.
  // WHY: collections sync WHOLESALE (a PUT replaces the collection and deletes
  // rows not in the payload). So when data is loaded straight into Postgres
  // (an admin/SQL load), a stale-but-dirty local copy would push back and wipe
  // it. Clearing the cache + dirty flags first makes the next pull win, without
  // touching the session - this replaces the old "sign out to force a refresh"
  // dance. Local unsynced edits ARE discarded, so the UI confirms first.
  const reloadFromCloud = useCallback(async () => {
    log("SYNC", "reloadFromCloud - discarding local cache, pulling fresh");
    FILES.forEach(f => lsDel("cache:" + f));
    const cleared = {}; FILES.forEach(f => cleared[f] = false);
    dirtyRef.current = cleared; setDirty(cleared); lsSet("dirty", cleared);
    const emptied = {}; FILES.forEach(f => emptied[f] = []);
    dataRef.current = emptied; setData(emptied);
    await pull();
  }, [pull]);

  return { cfg, saveCfg, data, sync, syncMsg, online, dirty, authed, authEmail, authReady,
           signIn, signUp, signOut, pull, pushDirty, upsert, seedMany, remove, restore,
           reloadFromCloud, setSync };
}

/* ============================================================ TOKENS ============================================================ */
// Three states, so the board is only loud when something is actually unusual:
//   home     -> quiet tint, flat
//   expected -> half-strength (at school / at the office, as always)
//   unusual  -> full color
// `calm` is kept as a shorthand for state="home".
function Token({ entity, size=34, title, onClick, calm, state }){
  const st = state || (calm ? "home" : "unusual");
  const isPet = entity.kind === "pet";
  const isWhite = (entity.color||"").toUpperCase() === "#FFFFFF";
  const bg = st === "home" ? rgba(entity.color, 0.16)
           : st === "expected" ? rgba(entity.color, 0.55)
           : entity.color;
  const txt = st === "home" ? "#19212B" : readableText(entity.color);
  const border = st === "unusual"
    ? (isWhite ? "1.5px solid #C7CDD6" : "none")
    : `1.5px solid ${isWhite ? "#C7CDD6" : rgba(entity.color, st === "home" ? 0.55 : 0.8)}`;
  return (
    <div className={"wa-token"+(isPet?" wa-token--pet":"")+(st!=="unusual"?" wa-token--calm":"")} title={title||entity.name} onClick={onClick}
      style={{ width:size, height:size, background:bg, color:txt,
        borderRadius:isPet?size*0.32:"50%", border, fontSize:size*0.34,
        cursor:onClick?"pointer":"default" }}>
      {entity.short}
      {isPet && (
        <svg className="wa-paw" viewBox="0 0 24 24" width={size*0.36} height={size*0.36} style={{ fill:txt }} aria-hidden="true">
          <circle cx="6" cy="9" r="2.1" /><circle cx="12" cy="6.5" r="2.1" /><circle cx="18" cy="9" r="2.1" />
          <path d="M12 11c-3 0-5 2.2-5 4.6C7 17.5 9 18.5 12 18.5s5-1 5-2.9C17 13.2 15 11 12 11z" />
        </svg>
      )}
    </div>
  );
}
function HalfToken({ entity, size=38, title }){
  const txt = readableText(entity.color);
  const needsBorder = (entity.color||"").toUpperCase() === "#FFFFFF";
  return (
    <div className="wa-token wa-token--half" title={title||entity.name}
      style={{ width:size, height:size, borderRadius:"50%",
        background:`linear-gradient(90deg, ${entity.color} 0 50%, ${rgba(entity.color, 0.12)} 50% 100%)`,
        color:txt, fontSize:size*0.34, border:needsBorder?"1.5px solid #C7CDD6":`1.5px solid ${entity.color}`,
        textShadow:"0 1px 2px rgba(0,0,0,.4)" }}>
      {entity.short}
    </div>
  );
}

/* ============================================================ NOW BOARD ============================================================ */
function NowBoard({ entities, cursor, setCursor, isLive, ctx }){
  const groups = useMemo(() => {
    const g = {};
    entities.forEach((e) => {
      const jr = ctx.journeyOf(e.id, cursor);
      if(jr){
        (g[jr.from] = g[jr.from] || []).push({ e, half:"from", other:jr.to });
        (g[jr.to] = g[jr.to] || []).push({ e, half:"to", other:jr.from });
      } else {
        const loc = ctx.placementAt(e.id, cursor);
        (g[loc] = g[loc] || []).push({ e, half:null });
      }
    });
    return g;
  }, [entities, cursor, ctx]);

  const occupied = ctx.placeOrder.filter((l) => groups[l] && groups[l].length);
  const hour = cursor.getHours();
  const setHour = (h) => { const x=new Date(cursor); x.setHours(h,0,0,0); setCursor(x); };
  const ampm = (h) => `${((h+11)%12)+1} ${h<12?"AM":"PM"}`;

  // One-glance headline. Counts only what is UNUSUAL - someone at school or at the
  // office on a normal day is not news, and counting them buries the real signal.
  const unusualCount = entities.filter((e) => {
    if(ctx.journeyOf(e.id, cursor)) return true;            // mid-move always counts
    return ctx.stateAt(e.id, cursor) === "unusual";
  }).length;
  const expectedCount = entities.filter((e) => ctx.stateAt(e.id, cursor) === "expected").length;

  return (
    <div>
      <div className="wa-scrub">
        <div className="wa-scrub__label">
          <span className="wa-mono">{ampm(hour)}</span>
          {isLive ? <span className="wa-livedot">live</span> : <span className="wa-scrub__hint">scrubbing</span>}
        </div>
        <input className="wa-range" type="range" min="0" max="23" value={hour} onChange={(e)=>setHour(Number(e.target.value))} aria-label="Time of day" />
        <div className="wa-scrub__ticks"><span>6 AM</span><span>Noon</span><span>6 PM</span><span>Midnight</span></div>
      </div>
      <div className="wa-headline">
        {unusualCount===0
          ? <span><span className="calm">Everyone's where they should be.</span>
              {expectedCount>0 && <span> · {expectedCount} away as usual</span>}</span>
          : <span><b>{unusualCount}</b> {unusualCount===1?"is":"are"} somewhere unusual
              {expectedCount>0 && <span> · {expectedCount} away as usual</span>}</span>}
      </div>
      <div className="wa-board">
        {occupied.map((locId) => {
          const loc = ctx.placeOf(locId);
          const here = groups[locId];
          const isMetro = loc.kind === "metro";
          return (
            <section key={locId} className={"wa-place"+(isMetro?" wa-place--home":"")}>
              <header className="wa-place__head">
                <div><h3 className="wa-place__name">{loc.name}</h3><span className="wa-place__addr">{loc.full}</span></div>
                <span className="wa-place__count">{here.length}</span>
              </header>
              <div className="wa-place__tokens">
                {here.map(({ e, half, other }) => (
                  <div key={e.id} className="wa-place__person" onClick={()=>ctx.onPick(e.id, cursor)}>
                    {half
                      ? <HalfToken entity={e} size={38} title={`${e.name}: ${ctx.placeOf(half==="from"?locId:other).name} → ${ctx.placeOf(half==="from"?other:locId).name}`} />
                      : <Token entity={e} size={38} state={ctx.stateAt(e.id, cursor)} />}
                    <span className="wa-place__pname">{firstName(e.name)}</span>
                    {half==="from" && <span className="wa-place__sub">{"→ " + ctx.placeOf(other).name}</span>}
                    {half==="to" && <span className="wa-place__sub">{ctx.placeOf(other).name + " →"}</span>}
                  </div>
                ))}
              </div>
            </section>
          );
        })}
      </div>
    </div>
  );
}

/* ============================================================ DAY VIEW ============================================================ */
function DayView({ entities, cursor, ctx }){
  const START=6, END=22; const span = END-START;
  const today = sameDay(cursor, new Date());
  const nowFrac = today ? (new Date().getHours() + new Date().getMinutes()/60 - START)/span : null;
  const lanes = entities.map((e) => {
    const segs = [];
    for(let h=START; h<END; h++){
      const probe = new Date(cursor.getFullYear(), cursor.getMonth(), cursor.getDate(), h);
      const loc = ctx.placementAt(e.id, probe);
      const last = segs[segs.length-1];
      if(last && last.loc===loc) last.e = h+1;
      else segs.push({ loc, s:h, e:h+1 });
    }
    return { entity:e, segs };
  });
  return (
    <div className="wa-day">
      <div className="wa-day__axis">
        <div className="wa-day__axisPad" />
        <div className="wa-day__hours">
          {Array.from({ length:span+1 }).map((_, i) => (
            <span key={i} className="wa-day__hour" style={{ left:`${(i/span)*100}%` }}>{((START+i+11)%12)+1}</span>
          ))}
        </div>
      </div>
      <div className="wa-day__grid">
        {lanes.map(({ entity, segs }) => (
          <div key={entity.id} className="wa-lane" onClick={()=>ctx.onPick(entity.id, cursor)} title={"Set where "+firstName(entity.name)+" is"}>
            <div className="wa-lane__who"><Token entity={entity} size={28} /><span className="wa-lane__name">{firstName(entity.name)}</span></div>
            <div className="wa-lane__track">
              {nowFrac!=null && nowFrac>=0 && nowFrac<=1 && <div className="wa-nowline" style={{ left:`${nowFrac*100}%` }} />}
              {segs.map((seg, i) => {
                const isHome = seg.loc === ctx.homeOf[entity.id];
                return (
                  <div key={i} className={"wa-seg"+(isHome?" wa-seg--home":"")}
                    style={{ left:`${((seg.s-START)/span)*100}%`, width:`${((seg.e-seg.s)/span)*100}%`,
                      background:isHome?"transparent":rgba(entity.color,0.16),
                      borderLeft:isHome?"none":`3px solid ${entity.color}`, color:isHome?"var(--muted)":"var(--ink)" }}>
                    <span className="wa-seg__label">{ctx.placeOf(seg.loc).name}</span>
                  </div>
                );
              })}
            </div>
          </div>
        ))}
      </div>
      <p className="wa-hint" style={{margin:"10px 4px 0"}}>Tap a person's row to set where they are on this day.</p>
    </div>
  );
}

/* ============================================================ WEEK VIEW ============================================================ */
function WeekView({ entities, cursor, ctx, onPickDay }){
  const sow = startOfWeek(cursor);
  const days = Array.from({ length:7 }).map((_, i) => addDays(sow, i));
  const today = new Date();
  return (
    <div className="wa-week">
      <div className="wa-week__scroll">
        <table className="wa-matrix">
          <thead>
            <tr>
              <th className="wa-matrix__corner">Who</th>
              {days.map((d) => (
                <th key={d.toISOString()} className={"wa-matrix__day"+(sameDay(d,today)?" is-today":"")} onClick={()=>onPickDay(d)}>
                  <span className="wa-matrix__dn">{DAY_NAMES[d.getDay()]}</span><span className="wa-matrix__dd">{d.getDate()}</span>
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {entities.map((e) => (
              <tr key={e.id}>
                <th className="wa-matrix__who" scope="row"><Token entity={e} size={24} /><span>{firstName(e.name)}</span></th>
                {days.map((d) => {
                  const jr = ctx.journeyOf(e.id, d);
                  if(jr){
                    return (
                      <td key={d.toISOString()} className="wa-cell wa-cell--journey"
                        style={{ background:`linear-gradient(135deg, ${rgba(e.color,0.26)} 0 50%, ${rgba(e.color,0.10)} 50% 100%)`, boxShadow:`inset 3px 0 0 ${e.color}` }}
                        onClick={()=>onPickDay(d)} title={`${ctx.placeOf(jr.from).name} → ${ctx.placeOf(jr.to).name}`}>
                        {ctx.placeOf(jr.from).name}<span className="wa-cell__arr"> {"→"} </span>{ctx.placeOf(jr.to).name}
                      </td>
                    );
                  }
                  const loc = ctx.dayPlacement(e.id, d);
                  const isHome = loc === ctx.homeOf[e.id];
                  return (
                    <td key={d.toISOString()} className={"wa-cell"+(isHome?" wa-cell--home":"")}
                      style={isHome?{}:{ background:rgba(e.color,0.15), boxShadow:`inset 3px 0 0 ${e.color}` }} onClick={()=>onPickDay(d)}>
                      {ctx.placeOf(loc).name}
                    </td>
                  );
                })}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <p className="wa-hint" style={{margin:"10px 4px 0"}}>Tap a day to open it. Read a column for where everyone is that day; read a row to follow one person across the week.</p>
    </div>
  );
}

/* ============================================================ MONTH VIEW ============================================================ */
function MonthView({ entities, cursor, ctx, onPickDay }){
  const y = cursor.getFullYear(), m = cursor.getMonth();
  const gridStart = startOfWeek(new Date(y, m, 1));
  const today = new Date();
  const cells = Array.from({ length:42 }).map((_, i) => addDays(gridStart, i));
  return (
    <div className="wa-month">
      <div className="wa-month__dow">{DAY_NAMES.map((d) => <span key={d}>{d}</span>)}</div>
      <div className="wa-month__grid">
        {cells.map((d) => {
          const inMonth = d.getMonth() === m;
          const away = entities.map((e) => ({ e, loc:ctx.dayPlacement(e.id, d) })).filter((x) => x.loc !== ctx.homeOf[x.e.id]);
          const tripDay = ctx.anyTrip(d);
          const boardingDay = away.some((x) => x.loc === "jordanvalley");
          return (
            <button key={d.toISOString()}
              className={"wa-mday"+(inMonth?"":" is-out")+(sameDay(d,today)?" is-today":"")+(tripDay?" is-trip":"")+(boardingDay?" is-board":"")}
              onClick={()=>onPickDay(d)}>
              <span className="wa-mday__n">{d.getDate()}</span>
              <span className="wa-mday__dots">
                {away.slice(0,8).map((x, i) => (
                  <span key={i} className="wa-dot" style={{ background:x.e.color, border:(x.e.color||"").toUpperCase()==="#FFFFFF"?"1px solid #C7CDD6":"none" }} />
                ))}
                {away.length>8 && <span className="wa-dot__more">+{away.length-8}</span>}
              </span>
            </button>
          );
        })}
      </div>
      <p className="wa-hint" style={{margin:"10px 4px 0"}}>Each dot is someone away from home. Quiet days mean everyone's home; trip and kennel days are tinted.</p>
    </div>
  );
}

/* ============================================================ YEAR VIEW ============================================================ */
function YearView({ entities, cursor, ctx, onPickMonth }){
  const y = cursor.getFullYear();
  const total = Math.max(1, entities.length);
  return (
    <div className="wa-year">
      {Array.from({ length:12 }).map((_, m) => {
        const gridStart = startOfWeek(new Date(y, m, 1));
        const cells = Array.from({ length:42 }).map((_, i) => addDays(gridStart, i));
        return (
          <div key={m} className="wa-ymonth">
            <button className="wa-ymonth__label" onClick={()=>onPickMonth(m)}>{MONTH_ABBR[m]}</button>
            <div className="wa-ymonth__grid">
              {cells.map((d) => {
                const inMonth = d.getMonth() === m;
                let awayCount = 0;
                if(inMonth){ entities.forEach((e) => { if(ctx.dayPlacement(e.id, d) !== ctx.homeOf[e.id]) awayCount++; }); }
                const intensity = inMonth ? awayCount/total : 0;
                const bg = !inMonth ? "transparent" : rgba("#19212B", 0.05 + intensity*0.55);
                return <span key={d.toISOString()} className="wa-ycell" style={{ background:bg }} title={inMonth ? `${MONTH_ABBR[m]} ${d.getDate()} - ${awayCount} away` : ""} />;
              })}
            </div>
          </div>
        );
      })}
    </div>
  );
}

/* ============================================================
   PLACEMENT SHEET - create/edit a pin, trip, or journey.
   ============================================================ */
function PlacementSheet({ entities, places, store, seed, onClose, toast }){
  const editing = !!(seed && seed.id);
  const firstE = entities[0] ? entities[0].id : "";
  const firstP = places[0] ? places[0].id : "";
  const secondP = places[1] ? places[1].id : firstP;
  const [type,setType]=useState((seed&&seed.type) || "pin");
  const [entityId,setEntityId]=useState((seed&&(seed.entityId||(seed.entityIds&&seed.entityIds[0]))) || firstE);
  const [entityIds,setEntityIds]=useState((seed&&seed.entityIds) || (seed&&seed.entityId?[seed.entityId]:[]) );
  const [date,setDate]=useState((seed&&seed.date) || ymd(new Date()));
  const [start,setStart]=useState((seed&&seed.start) || ymd(new Date()));
  const [end,setEnd]=useState((seed&&seed.end) || ymd(new Date()));
  const [place,setPlace]=useState((seed&&seed.place) || firstP);
  const [from,setFrom]=useState((seed&&seed.from) || firstP);
  const [to,setTo]=useState((seed&&seed.to) || secondP);
  const [tag,setTag]=useState((seed&&seed.tag) || "");

  function toggleId(id){ setEntityIds((arr)=> arr.includes(id) ? arr.filter(x=>x!==id) : [...arr, id]); }

  function save(){
    let rec;
    if(type==="pin"){ if(!entityId||!place){ toast("Pick a person and place"); return; } rec={ id:seed&&seed.id, type:"pin", entityId, date, place }; }
    else if(type==="journey"){ if(!entityId){ toast("Pick a person"); return; } if(from===to){ toast("From and To should differ"); return; } rec={ id:seed&&seed.id, type:"journey", entityId, date, from, to }; }
    else { const ids = entityIds.length?entityIds:(entityId?[entityId]:[]); if(!ids.length||!place){ toast("Pick people and a place"); return; }
      if(strToYmd(end) < strToYmd(start)){ toast("End is before start"); return; } rec={ id:seed&&seed.id, type:"trip", entityIds:ids, start, end, place, tag }; }
    store.upsert("placements", rec);
    toast(editing?"Updated":"Saved"); onClose();
  }
  function del(){ if(seed&&seed.id){ store.remove("placements", seed.id); toast("Removed"); } onClose(); }

  const TypeBtn = (t,label) => <button className={"wa-segctl__b"+(type===t?" is-on":"")} onClick={()=>setType(t)}>{label}</button>;
  const personOptions = entities.map(e => <option key={e.id} value={e.id}>{e.name}</option>);
  const placeOptions = places.map(p => <option key={p.id} value={p.id}>{p.name}</option>);

  return (
    <div className="wa-modalscrim" onClick={onClose}>
      <div className="wa-sheet" onClick={(e)=>e.stopPropagation()} role="dialog" aria-label="Set location">
        <div className="wa-sheet__head">
          <h2>{editing?"Edit placement":"Set location"}</h2>
          <button className="wa-x" onClick={onClose} aria-label="Close">{"×"}</button>
        </div>
        <div className="wa-segctl">{TypeBtn("pin","Pin (a day)")}{TypeBtn("trip","Trip (range)")}{TypeBtn("journey","Journey")}</div>

        {type!=="trip" &&
          <div className="wa-field"><span className="wa-label">Person</span>
            <select className="wa-select" value={entityId} onChange={e=>setEntityId(e.target.value)}>{personOptions}</select></div>}

        {type==="pin" && <>
          <div className="wa-field"><span className="wa-label">Date</span><input className="wa-input" type="date" value={date} onChange={e=>setDate(e.target.value)} /></div>
          <div className="wa-field"><span className="wa-label">Place</span><select className="wa-select" value={place} onChange={e=>setPlace(e.target.value)}>{placeOptions}</select></div>
        </>}

        {type==="journey" && <>
          <div className="wa-field"><span className="wa-label">Date</span><input className="wa-input" type="date" value={date} onChange={e=>setDate(e.target.value)} /></div>
          <div className="wa-row2">
            <div className="wa-field"><span className="wa-label">From</span><select className="wa-select" value={from} onChange={e=>setFrom(e.target.value)}>{placeOptions}</select></div>
            <div className="wa-field"><span className="wa-label">To</span><select className="wa-select" value={to} onChange={e=>setTo(e.target.value)}>{placeOptions}</select></div>
          </div>
          <p className="wa-hint">A travel day splits at midday (morning at From, afternoon at To).</p>
        </>}

        {type==="trip" && <>
          <div className="wa-field"><span className="wa-label">Who (one or more)</span>
            <div className="wa-checks">
              {entities.map(e => (
                <button key={e.id} className={"wa-checkpill"+(entityIds.includes(e.id)?" is-on":"")} onClick={()=>toggleId(e.id)}>
                  <Token entity={e} size={18} />{firstName(e.name)}
                </button>
              ))}
            </div>
          </div>
          <div className="wa-row2">
            <div className="wa-field"><span className="wa-label">Start</span><input className="wa-input" type="date" value={start} onChange={e=>setStart(e.target.value)} /></div>
            <div className="wa-field"><span className="wa-label">End</span><input className="wa-input" type="date" value={end} onChange={e=>setEnd(e.target.value)} /></div>
          </div>
          <div className="wa-field"><span className="wa-label">Place</span><select className="wa-select" value={place} onChange={e=>setPlace(e.target.value)}>{placeOptions}</select></div>
          <div className="wa-field"><span className="wa-label">Tag (optional)</span>
            <select className="wa-select" value={tag} onChange={e=>setTag(e.target.value)}>
              <option value="">None</option><option value="work">Work</option><option value="vacation">Vacation</option>
            </select></div>
        </>}

        <button className="wa-btn wa-btn--primary wa-btn--block" onClick={save}>{editing?"Save changes":"Save"}</button>
        {editing && <button className="wa-btn wa-btn--danger wa-btn--block" style={{marginTop:10}} onClick={del}>Remove this placement</button>}
      </div>
    </div>
  );
}

/* ============================================================ PERSON / PLACE EDITORS ============================================================ */
function PersonEditor({ entity, places, store, onClose, toast }){
  const t = entity || {};
  const [name,setName]=useState(t.name||"");
  const [short,setShort]=useState(t.short||"");
  const [kind,setKind]=useState(t.kind||"person");
  const [color,setColor]=useState(t.color||"#1E40AF");
  const [home,setHome]=useState(t.home || (places[0]?places[0].id:"sanantonio"));
  // --- the recurring routine (slice 3b): editable instead of hardcoded ---
  const r0 = t.routine || {};
  const [base,setBase]=useState(r0.base || t.home || (places[0]?places[0].id:"sanantonio"));
  const [dayOv,setDayOv]=useState(()=> Object.entries(r0.days||{})
      .map(([d,v]) => ({ d:Number(d), place:v.place, from:v.from==null?0:v.from, to:v.to==null?24:v.to, outside:v.outside||"" })));
  const [followId,setFollowId]=useState((r0.follows&&r0.follows.entityId)||"");
  const [followFb,setFollowFb]=useState((r0.follows&&r0.follows.fallback)||"");
  const c0 = t.custody || {};
  const [cusPattern,setCusPattern]=useState(c0.pattern||"none");
  const [cusPlace,setCusPlace]=useState(c0.place||"");
  const [cusAnchor,setCusAnchor]=useState(c0.anchor||ymd(new Date()));
  const others = (store.data.entities||[]).filter(e => e.id !== t.id);

  function save(){
    if(!name.trim()){ toast("Name it first"); return; }
    const s = ((short||name.slice(0,2)).trim()||name.slice(0,2)).slice(0,2);
    const days = {};
    dayOv.forEach(o => { if(o.place) days[String(o.d)] = {
      place:o.place, from:Number(o.from), to:Number(o.to), outside:o.outside||undefined }; });
    const routine = followId
      ? { base, follows:{ entityId:followId, fallback:followFb || base } }
      : { base, days: Object.keys(days).length ? days : undefined };
    const custody = cusPattern !== "none" && cusPlace
      ? { pattern:cusPattern, place:cusPlace, anchor:cusAnchor } : null;
    store.upsert("entities", { id:t.id, name:name.trim(), short:s, kind, color, home,
                               order:t.order, routine, custody });
    toast(t.id?"Saved":"Added"); onClose();
  }
  const addDay = () => setDayOv(a => [...a, { d:1, place:base, from:0, to:24, outside:"" }]);
  const setDay = (i, patch) => setDayOv(a => a.map((o,k) => k===i ? { ...o, ...patch } : o));
  const delDay = (i) => setDayOv(a => a.filter((_,k) => k!==i));
  const placeOpts = places.map(p=><option key={p.id} value={p.id}>{p.name}</option>);
  function del(){ if(t.id){ store.remove("entities", t.id); toast("Removed"); } onClose(); }
  return (
    <div className="wa-modalscrim" onClick={onClose}>
      <div className="wa-sheet" onClick={(e)=>e.stopPropagation()} role="dialog" aria-label="Edit person">
        <div className="wa-sheet__head"><h2>{t.id?"Edit":"Add person or pet"}</h2><button className="wa-x" onClick={onClose}>{"×"}</button></div>
        <div className="wa-field"><span className="wa-label">Name</span><input className="wa-input" value={name} onChange={e=>setName(e.target.value)} placeholder="Name" autoFocus /></div>
        <div className="wa-row2">
          <div className="wa-field"><span className="wa-label">Initials</span><input className="wa-input" value={short} maxLength={2} onChange={e=>setShort(e.target.value)} placeholder="2 letters" /></div>
          <div className="wa-field"><span className="wa-label">Kind</span>
            <select className="wa-select" value={kind} onChange={e=>setKind(e.target.value)}><option value="person">Person</option><option value="pet">Pet</option></select></div>
        </div>
        <div className="wa-row2">
          <div className="wa-field"><span className="wa-label">Color</span><input type="color" className="wa-set__color" style={{width:"100%",height:44}} value={color} onChange={e=>setColor(e.target.value)} /></div>
          <div className="wa-field"><span className="wa-label">Home base</span>
            <select className="wa-select" value={home} onChange={e=>setHome(e.target.value)}>{places.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</select></div>
        </div>

        <p className="wa-set__group" style={{marginTop:6}}>Usual routine</p>
        <div className="wa-field">
          <span className="wa-label">Usually in</span>
          <select className="wa-select" value={base} onChange={e=>setBase(e.target.value)}>{placeOpts}</select>
          <p className="wa-hint">Where they are on an ordinary day. Trips and pins override this.</p>
        </div>

        <div className="wa-field">
          <span className="wa-label">Follows someone (for pets)</span>
          <select className="wa-select" value={followId} onChange={e=>setFollowId(e.target.value)}>
            <option value="">Nobody - use the routine below</option>
            {others.map(e=><option key={e.id} value={e.id}>{e.name}</option>)}
          </select>
          {followId && (
            <div style={{marginTop:8}}>
              <span className="wa-label">When that person is somewhere they can't come</span>
              <select className="wa-select" value={followFb} onChange={e=>setFollowFb(e.target.value)}>
                <option value="">Stay at home base</option>{placeOpts}
              </select>
            </div>
          )}
        </div>

        {!followId && (
          <div className="wa-field">
            <span className="wa-label">Specific days</span>
            {dayOv.length===0 && <p className="wa-hint">Same every day. Add a day if they're somewhere else on, say, Tuesdays.</p>}
            {dayOv.map((o,i) => (
              <div key={i} className="wa-dayov">
                <select className="wa-select" value={o.d} onChange={e=>setDay(i,{d:Number(e.target.value)})}>
                  {DAY_NAMES.map((dn,di)=><option key={di} value={di}>{dn}</option>)}
                </select>
                <select className="wa-select" value={o.place} onChange={e=>setDay(i,{place:e.target.value})}>{placeOpts}</select>
                <select className="wa-select" value={o.from} onChange={e=>setDay(i,{from:e.target.value})}>
                  {Array.from({length:25}).map((_,h)=><option key={h} value={h}>{h===0||h===24?"12am":h<12?h+"am":h===12?"12pm":(h-12)+"pm"}</option>)}
                </select>
                <select className="wa-select" value={o.to} onChange={e=>setDay(i,{to:e.target.value})}>
                  {Array.from({length:25}).map((_,h)=><option key={h} value={h}>{h===0||h===24?"12am":h<12?h+"am":h===12?"12pm":(h-12)+"pm"}</option>)}
                </select>
                <select className="wa-select" value={o.outside} onChange={e=>setDay(i,{outside:e.target.value})}>
                  <option value="">rest of day: usual</option>{placeOpts}
                </select>
                <button className="wa-prow__del" onClick={()=>delDay(i)} title="Remove">{"×"}</button>
              </div>
            ))}
            <button className="wa-addrow" onClick={addDay}>+ Add a day</button>
          </div>
        )}

        <p className="wa-set__group">Custody rotation</p>
        <div className="wa-field">
          <select className="wa-select" value={cusPattern} onChange={e=>setCusPattern(e.target.value)}>
            <option value="none">None</option>
            <option value="alt-weekends">Every other weekend</option>
            <option value="week-on-off">Week on, week off</option>
          </select>
          {cusPattern!=="none" && (
            <div className="wa-row2" style={{marginTop:8}}>
              <div><span className="wa-label">Where</span>
